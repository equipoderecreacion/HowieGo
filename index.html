<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HowieGO - Howard Johnson</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --azul: #004A97; --naranja: #F57C00; --fondo: #f8f9fa; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: var(--fondo); color: #333; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; min-height: 100vh; width: 100%; box-sizing: border-box; padding: 20px; flex-direction: column; align-items: center; position: relative; }
        .screen.active { display: flex; }
        #login-screen { background: linear-gradient(135deg, var(--azul) 0%, #002d5c 100%); justify-content: center; }
        .card-login { background: white; padding: 30px; border-radius: 25px; width: 85%; max-width: 340px; text-align: center; border: 4px solid var(--naranja); box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .howie-container { position: relative; width: 120px; height: 130px; margin: 0 auto 15px; }
        .howie-cuerpo { width: 100%; position: absolute; bottom: 0; left: 0; z-index: 1; }
        .ala-animada { width: 100px; position: absolute; top: 20px; left: 12px; z-index: 2; transform-origin: 30% 70%; animation: saludo 2s ease-in-out infinite; }
        @keyframes saludo { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } }
        .logo-txt { font-size: 32px; font-weight: 900; color: var(--azul); margin: 5px 0; text-transform: uppercase; letter-spacing: -1px; }
        .logo-go { color: var(--naranja); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; }
        #saludo { color: var(--azul); font-weight: 900; margin-top: 40px; font-size: 30px; text-transform: uppercase; text-align: center; }
        .btn-home { width: 92%; max-width: 320px; height: 110px; border-radius: 25px; margin: 15px 0; border: none; cursor: pointer; position: relative; overflow: visible; color: white; display: flex; align-items: center; padding: 0 25px; transition: transform 0.1s; z-index: 5; }
        #btn-mapa { background: var(--naranja); box-shadow: 0 6px 15px rgba(245,124,0,0.3); text-align: left; }
        #btn-album { background: var(--azul); box-shadow: 0 6px 15px rgba(0,74,151,0.3); text-align: right; justify-content: flex-end; }
        .btn-home b { font-size: 22px; display: block; }
        .btn-home span { font-size: 13px; opacity: 0.9; text-transform: uppercase; }
        .sticker-img { position: absolute; width: 155px; bottom: -15px; z-index: 10; pointer-events: none; filter: drop-shadow(2px 5px 8px rgba(0,0,0,0.2)); }
        .pos-der { right: -25px; }
        .pos-izq { left: -25px; transform: scaleX(-1); }
        .zona-item { width: 100%; background: white; margin: 10px 0; padding: 15px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 2px solid transparent; box-sizing: border-box; }
        .zona-actual { border-color: var(--naranja); background: #fff9e6; }
        .zona-bloqueada { opacity: 0.5; filter: grayscale(1); }
        .zona-hecha { background: #e8f5e9; color: #2e7d32; border-color: #c8e6c9; }
        .card-mision { background: white; width: 100%; max-width: 360px; padding: 25px; border-radius: 25px; border: 4px solid var(--naranja); text-align: center; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn-hj { background: var(--naranja); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: bold; width: 100%; margin: 10px 0; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        .btn-ayuda { background: var(--azul); width: 85%; font-size: 14px; margin-top: 5px; }
        #reader { width: 100%; border-radius: 15px; margin-top: 15px; display: none; overflow: hidden; border: 3px solid var(--naranja); }
        .grid-album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 380px; margin: 20px 0; }
        .slot-figu { aspect-ratio: 2/3; background: #e0e0e0; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px dashed #999; overflow: hidden; position: relative; }
        .slot-figu img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="card-login">
            <div class="howie-container">
                <img src="img/howie-cuerpo.png" class="howie-cuerpo">
                <img src="img/howie-ala.png" class="ala-animada">
            </div>
            <h1 class="logo-txt">Howie<span class="logo-go">GO</span></h1>
            <input type="text" id="inputNombre" placeholder="Tu Nombre">
            <input type="text" id="inputHab" placeholder="Nro Habitación">
            <button class="btn-hj" onclick="comenzar()">¡EMPEZAR!</button>
        </div>
    </div>

    <div id="home-screen" class="screen">
        <h1 id="saludo">HOLA</h1>
        <p style="color:#666; font-size: 18px;">¡Vamos a la aventura! 🦉✨</p>
        <button id="btn-mapa" class="btn-home" onclick="irA('mapa-screen')"><div><span>Misiones</span><b>VER MAPA</b></div><img src="img/boton-mapa.png" class="sticker-img pos-der"></button>
        <button id="btn-album" class="btn-home" onclick="irA('album-screen')"><img src="img/boton-album.png" class="sticker-img pos-izq"><div><span>Mis Figus</span><b>MI ÁLBUM</b></div></button>
        <div id="cont-campeon" style="display:none; width:100%; text-align:center;"><button class="btn-hj" style="background:#4CAF50; width:92%;" onclick="reclamarPremio()">🎁 ¡RECLAMAR MI PREMIO!</button></div>
        <button onclick="cerrarSesion()" style="background:none; border:none; color:#999; text-decoration:underline; margin-top:50px; cursor:pointer;">Cerrar Sesión</button>
    </div>

    <div id="mapa-screen" class="screen"><h2 style="color:var(--azul)">MAPA DE MISIONES</h2><div id="listaZonas" style="width:100%"></div><button class="btn-hj btn-ayuda" onclick="irA('home-screen')">⬅ VOLVER</button></div>

    <div id="mision-screen" class="screen">
        <div class="card-mision">
            <h2 id="m-titulo" style="color:var(--naranja); margin:0; text-transform:uppercase;"></h2>
            <p id="m-texto" style="font-size:16px; color:#444; line-height:1.5; margin:20px 0;"></p>
            <div id="cont-e1"><button class="btn-hj" onclick="abrirEscaner()">🔍 ESCANEAR CÓDIGO QR</button><div id="reader"></div></div>
            <div id="cont-e2" style="display:none;"><div id="modo-normal"><input type="text" id="res-input" placeholder="Tu respuesta..."><button class="btn-hj" onclick="validarRespuesta()">ENVIAR DESAFÍO</button></div><div id="modo-foto" style="display:none;"><button class="btn-hj" onclick="tomarFoto()">📸 TOMAR FOTO</button></div></div>
            <button id="btn-ayuda-wa" class="btn-hj btn-ayuda" onclick="ayudaWA()">🆘 PEDIR AYUDA</button>
        </div>
        <button class="btn-hj btn-ayuda" onclick="irA('mapa-screen')" style="margin-top:20px;">⬅ VOLVER AL MAPA</button>
    </div>

    <div id="e3-screen" class="screen">
        <div class="card-mision" style="border-color:#4CAF50; padding:35px;"><h2 id="e3-tit" style="color:#4CAF50; margin:0;">¡EXCELENTE! 🎉</h2><p id="e3-txt" style="margin:15px 0; color:#555;"></p><div id="figu-slot" class="slot-figu" style="width:160px; height:240px; margin:20px auto; border:4px solid #4CAF50;"></div><button class="btn-hj" style="background:#4CAF50" onclick="irA('album-screen')">📖 VER MI ÁLBUM</button></div>
    </div>

    <div id="album-screen" class="screen"><h2 style="color:var(--azul); margin-top:20px;">MI ÁLBUM HOWIEGO</h2><div id="grid-album" class="grid-album"></div><button class="btn-hj btn-ayuda" style="width:90%" onclick="irA('home-screen')">🏠 VOLVER AL INICIO</button></div>

    <script>
        const zonas = ["Bicis", "Lobby", "Resto", "Arqueria", "Patio Cervecero", "Escaleras", "Camastros", "Kids", "Plaza", "Estatuas", "Pileta", "Plays"];
        const misiones = {
            "Bicis": { e1: "Howie dice que el viento solo se siente real cuando lo perseguís a dos ruedas.", e2: "¿Cuántas bicicletas con rueditas de aprendizaje ves acá?", r: ["0", "cero", "ninguna"] },
            "Lobby": { e1: "Aquí Howie se relaja y se queda mirando a los que llegan y a los que se van.", e2: "¿A qué hora es el último adiós a la habitación?", r: ["10", "diez", "las 10"] },
            "Resto": { e1: "Howie dice que es su lugar favorito para comer en familia.", e2: "En la carta de pizza contá hasta 3.", r: ["especial", "la especial"] },
            "Arqueria": { e1: "La paciencia es como una flecha.", e2: "¿Círculo de más valor?", r: ["amarillo", "el amarillo"] },
            "Patio Cervecero": { e1: "Bajo las luces se cuentan mejores historias.", e2: "Formá la inicial del encargado con piedritas.", tipo: "foto", r: ["foto", "piedra"] },
            "Escaleras": { e1: "Desde acá las cosas se ven distintas…", e2: "Tomá una foto de la ciudad desde donde el esfuerzo afloja.", tipo: "foto", r: ["foto", "vista"] },
            "Camastros": { e1: "Donde el tiempo se detiene.", e2: "¿Cómo se llama el escenario?", r: ["escenario", "el escenario"] },
            "Kids": { e1: "Howie se siente chiquito otra vez.", e2: "Tiene cuatro patas y mueve la cola.", r: ["perro", "perros", "perrito"] },
            "Plaza": { e1: "Howie sigue el rastro de la arena.", e2: "¿Cuántos balcones tiene el edificio frente a ti?", r: ["16", "dieciseis", "dieciséis"] },
            "Estatuas": { e1: "Figuras que no se mueven.", e2: "¿Siglas en la base del guerrero?", r: ["osn"] },
            "Pileta": { e1: "¡No se corre en la pile!", e2: "¿Quién vigila el agua?", r: ["bañero", "guardavidas", "el bañero"] },
            "Plays": { e1: "Sonidos de victoria.", e2: "¿Qué personaje famoso es?", r: ["kratos", "cratos"] }
        };

        let db = { nombre: "", hab: "", actual: "", ganadas: [], modo: "e1" };

        function irA(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'home-screen') checkCampeon();
            if(id === 'mapa-screen') {
                // SEGURO ANTI-BLOQUEO: Si no hay estrella, buscar una.
                if(!db.actual || db.actual === "" || db.actual === "FINAL" || db.ganadas.includes(db.actual)) {
                    proximaMision();
                }
                renderMapa();
            }
            if(id === 'album-screen') renderAlbum();
            window.scrollTo(0,0);
        }

        function comenzar() {
            const n = document.getElementById('inputNombre').value.trim();
            const h = document.getElementById('inputHab').value.trim();
            if(!n || !h) return Swal.fire("¡Epa!", "Completá tus datos", "warning");
            db.nombre = n; db.hab = h; db.ganadas = [];
            proximaMision();
            document.getElementById('saludo').innerText = `¡HOLA ${n.toUpperCase()}!`;
            save(); irA('home-screen');
        }

        function proximaMision() {
            const libres = zonas.filter(z => !db.ganadas.includes(z));
            if(libres.length > 0) {
                db.actual = libres[Math.floor(Math.random() * libres.length)];
                db.modo = "e1";
            } else {
                db.actual = "FINAL";
            }
            save();
        }

        function renderMapa() {
            const list = document.getElementById('listaZonas'); list.innerHTML = "";
            zonas.forEach(z => {
                const ok = db.ganadas.includes(z); const esHoy = z === db.actual;
                const item = document.createElement('div');
                item.className = `zona-item ${esHoy ? 'zona-actual' : ''} ${ok ? 'zona-hecha' : (!esHoy ? 'zona-bloqueada' : '')}`;
                item.innerHTML = `<b>${ok ? '✔️' : (esHoy ? '⭐' : '🔒')} ${z}</b>`;
                if(esHoy && !ok) item.onclick = () => {
                    document.getElementById('m-titulo').innerText = db.actual;
                    document.getElementById('m-texto').innerText = misiones[db.actual].e1;
                    document.getElementById('cont-e1').style.display = "block";
                    document.getElementById('cont-e2').style.display = "none";
                    irA('mision-screen');
                };
                list.appendChild(item);
            });
        }

        let html5QrCode; // Variable global para controlar la cámara

function abrirEscaner() {
    const rd = document.getElementById('reader');
    rd.style.display = "block";
    
    // Si ya había una instancia, intentamos cerrarla antes de empezar
    if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
    }

    html5QrCode = new Html5Qrcode("reader");
    
    const config = { fps: 10, qrbox: 250 };

    html5QrCode.start({ facingMode: "environment" }, config, (txt) => {
        // LIMPIEZA DE TEXTO (Blindada)
        const leido = txt.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
        const esperado = db.actual.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");

        if (leido.includes(esperado) || esperado.includes(leido)) {
            // DETENCIÓN CRÍTICA: Apagamos la cámara ANTES de cambiar de pantalla
            html5QrCode.stop().then(() => {
                rd.style.display = "none";
                pasarE2();
            }).catch(err => {
                console.error("Error al apagar cámara", err);
                rd.style.display = "none";
                pasarE2(); // Pasamos igual aunque falle el stop visual
            });
        } else {
            Swal.fire("¡Epa!", "Ese QR no es de " + db.actual, "error");
        }
    }).catch(err => {
        Swal.fire("Error de Cámara", "Asegurate de dar permisos o refrescá la página.", "error");
    });
}

function pasarE2() {
    db.modo = "e2";
    // Limpiamos el lector por las dudas si quedó algo en el DOM
    document.getElementById('reader').innerHTML = ""; 
    document.getElementById('m-texto').innerText = misiones[db.actual].e2;
    document.getElementById('cont-e1').style.display = "none";
    document.getElementById('cont-e2').style.display = "block";
    
    const esFoto = misiones[db.actual].tipo === "foto";
    document.getElementById('modo-normal').style.display = esFoto ? "none" : "block";
    document.getElementById('modo-foto').style.display = esFoto ? "block" : "none";
    save();
}

        function pasarE2() {
            db.modo = "e2";
            document.getElementById('m-texto').innerText = misiones[db.actual].e2;
            document.getElementById('cont-e1').style.display = "none";
            document.getElementById('cont-e2').style.display = "block";
            const esFoto = misiones[db.actual].tipo === "foto";
            document.getElementById('modo-normal').style.display = esFoto ? "none" : "block";
            document.getElementById('modo-foto').style.display = esFoto ? "block" : "none";
        }

        function tomarFoto() {
            Swal.fire({ title: "¡Foto Lista!", text: "Adjuntala en el WhatsApp.", icon: "success" }).then(() => {
                document.getElementById('btn-ayuda-wa').innerText = "📤 ENVIAR FOTO A HOWIE";
                document.getElementById('modo-normal').style.display = "block";
            });
        }

        function validarRespuesta() {
            const val = document.getElementById('res-input').value.trim().toLowerCase();
            if(misiones[db.actual].r.some(r => val.includes(r))) {
                db.ganadas.push(db.actual);
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                document.getElementById('e3-tit').innerText = db.ganadas.length === 12 ? "¡LO LOGRASTE! 🏆" : "¡EXCELENTE! 🎉";
                document.getElementById('e3-txt').innerText = db.ganadas.length === 12 ? "Álbum completo." : `¡Ganaste la figu de ${db.actual}!`;
                const img = db.actual.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                document.getElementById('figu-slot').innerHTML = `<img src="img/${img}.jpg">`;
                proximaMision(); save(); irA('e3-screen');
                document.getElementById('res-input').value = "";
            } else { Swal.fire("Casi", "Intentalo de nuevo", "error"); }
        }

        function renderAlbum() {
            const grid = document.getElementById('grid-album'); grid.innerHTML = "";
            zonas.forEach(z => {
                const ok = db.ganadas.includes(z);
                const slot = document.createElement('div'); slot.className = "slot-figu";
                const img = z.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                slot.innerHTML = ok ? `<img src="img/${img}.jpg">` : `🔒<br><small style="position:absolute; bottom:5px; font-size:9px;">${z}</small>`;
                grid.appendChild(slot);
            });
        }

        function ayudaWA() {
            const msj = `Hola Howie, soy ${db.nombre}, necesito ayuda en ${db.actual}.`;
            window.open(`https://wa.me/5493541215391?text=${encodeURIComponent(msj)}`);
        }

        function checkCampeon() { if(db.ganadas.length === 12) { document.getElementById('cont-campeon').style.display = "block"; document.getElementById('btn-mapa').style.display = "none"; } }

        function reclamarPremio() {
            const msj = `¡Howie lo logré! Soy ${db.nombre} de la hab ${db.hab}. ¡Álbum completo! 🦉🎁`;
            window.open(`https://wa.me/5493541215391?text=${encodeURIComponent(msj)}`);
        }

        function save() { localStorage.setItem('howiego_final', JSON.stringify(db)); }
        function cerrarSesion() {
            Swal.fire({ title: '¿Salir?', text: "Perderás tus figus.", icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí' }).then(r => { if(r.isConfirmed){ localStorage.clear(); location.reload(); } });
        }

        window.onload = () => {
            const s = localStorage.getItem('howiego_final');
            if(s) { db = JSON.parse(s); document.getElementById('saludo').innerText = `¡HOLA ${db.nombre.toUpperCase()}!`; irA('home-screen'); }
        };
    </script>
</body>
</html>
