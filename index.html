<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howie GO - Howard Johnson</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* 1. BASES Y PANTALLAS (SISTEMA ANTIBLOQUEO) */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; overflow-x: hidden; }
        
        .screen { 
            display: none !important; 
            min-height: 100vh; 
            width: 100%; 
            box-sizing: border-box; 
            padding: 20px; 
        }
        
        .screen.active { 
            display: block !important; 
        }

        /* Especial para centrar contenido en Login y Home */
        #login-screen.active, #home-screen.active {
            display: flex !important;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 2. DISEÑO DE IDENTIDAD (AZUL Y NARANJA HJ) */
        #login-screen {
            background: linear-gradient(135deg, #004A97 0%, #003366 100%);
        }

        .card-sticker {
            background: white; padding: 25px; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 85%; max-width: 320px; text-align: center;
            border: 3px solid #F57C00;
        }

        /* 3. HOWIE ANIMADO */
        .howie-container { position: relative; width: 100px; height: 110px; margin: 0 auto 15px; }
        .howie-cuerpo { width: 100%; position: absolute; bottom: 0; left: 0; z-index: 1; }
        .ala-animada {
            width: 85px; position: absolute; top: 18px; left: 10px; z-index: 2;
            transform-origin: 30% 70%; animation: saludoHowie 2s ease-in-out infinite;
        }
        @keyframes saludoHowie { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } }

        /* 4. COMPONENTES DE INTERFAZ */
        h1 { color: #004A97; margin: 0; font-size: 28px; text-transform: uppercase; letter-spacing: -1px; }
        h2 { color: #004A97; text-align: center; }
        .highlight { color: #F57C00; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        
        .btn-hj { background: #F57C00; color: white; border: none; padding: 15px; width: fit-content; min-width: 260px; margin: 10px auto; border-radius: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.1s; }
        .btn-hj:active { transform: scale(0.98); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-blue { background: #004A97; }

        .zona-item { background: white; padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .zona-completada { background-color: #e8f5e9; border-color: #c8e6c9; }
        .txt-completado { color: #2e7d32; font-weight: bold; font-size: 14px; }
        
        #contenedorFiguritas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .sticker-slot { aspect-ratio: 2/3; background: #e0e0e0; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed #999; }
        .img-sticker { width: 100%; height: 100%; object-fit: cover; }
    /* ESTILOS PARA ESTOS NUEVOS BOTONES */
/* --- BLOQUE DE BOTONES HOME (REPARADO) --- */

.btn-contenedor-sticker {
    background: #F57C00; /* Naranja HJ */
    color: white;
    width: 90%;
    max-width: 320px;
    height: 100px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-shadow: 0 6px 15px rgba(245, 124, 0, 0.3);
    cursor: pointer;
    transition: transform 0.1s;
    position: relative;
    overflow: visible; /* Clave para que el sticker sobresalga */
    margin-bottom: 20px; /* Espacio entre botones */
}

.btn-azul {
    background: #004A97; /* Azul HJ */
    box-shadow: 0 6px 15px rgba(0, 74, 151, 0.3);
}

.btn-contenedor-sticker:active {
    transform: scale(0.96);
}

.btn-texto-lado {
    text-align: left;
    flex: 1;
    z-index: 5; /* Asegura que el texto no quede atrás del sticker */
}

.btn-sticker-lado {
    width: 100px;
    height: 100px;
    position: relative; 
    display: flex;
    align-items: center;
    justify-content: center;
}

/* REGLA GENERAL PARA LOS DOS HOWIES */
.btn-sticker-lado img {
    width: 140px; 
    height: auto;
    position: absolute;
    bottom: 5px; 
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
    right: -10px; /* Por defecto a la derecha (Botón Mapa) */
    z-index: 10;
}

/* REGLA ESPECÍFICA PARA EL HOWIE DEL ÁLBUM (EL ESPEJADO) */
/* Usamos "img.espejado" para que tenga más fuerza que la regla de arriba */
img.espejado {
    right: auto !important; 
    left: -15px !important; 
}
</style>

</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="card-sticker">
            <div class="howie-container">
                <img src="img/howie-cuerpo.png" class="howie-cuerpo">
                <img src="img/howie-ala.png" class="ala-animada">
            </div>
            <h1>Howie<span class="highlight">GO</span></h1>
            <p style="color:#666; font-size:13px; margin-bottom: 20px;">¡Bienvenidos a la aventura!</p>
            <input type="text" id="inputNombre" placeholder="Nombre del Huésped">
            <input type="text" id="inputHabitacion" placeholder="Nro de Habitación">
            <button class="btn-hj" onclick="comenzarJuego()">¡Empezar Juego!</button>
        </div>
    </div>

   <div id="home-screen" class="screen">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; gap: 20px;">
        
        <div style="text-align: center; margin-bottom: 10px;">
            <h1 id="saludo" style="color: #004A97; margin: 0; font-size: 32px; text-transform: uppercase;">¡HOLA!</h1>
            <p style="color: #666; font-size: 18px; margin: 5px 0;">¡Vamos a la aventura! 🦉✨</p>
        </div>
        
        <div class="btn-contenedor-sticker" onclick="irA('mapa-screen')">
            <div class="btn-texto-lado">
                <span style="font-size: 13px; opacity: 0.8; display: block; text-transform: uppercase;">Misiones</span>
                <span style="font-size: 21px; font-weight: bold;">VER MAPA</span>
            </div>
            <div class="btn-sticker-lado">
                <img src="img/boton-mapa.png" alt="Howie Mapa">
            </div>
        </div>
        
        <div class="btn-contenedor-sticker btn-azul" onclick="irA('album-screen')">
            <div class="btn-sticker-lado">
                <img src="img/boton-album.png" alt="Howie Álbum" class="espejado">
            </div>
            <div class="btn-texto-lado" style="text-align: right;">
                <span style="font-size: 13px; opacity: 0.8; display: block; text-transform: uppercase;">Mis Figus</span>
                <span style="font-size: 21px; font-weight: bold;">MI ÁLBUM</span>
            </div>
        </div>

        <button onclick="cerrarSesion()" style="margin-top: 25px; background: none; border: none; color: #999; text-decoration: underline; font-size: 12px; cursor: pointer;">
            Cerrar Sesión / Salir
        </button>
    </div>
</div>

    <div id="album-screen" class="screen">
        <h2>Mis Figuritas</h2>
        <div id="contenedorFiguritas"></div>
        <button class="btn-hj btn-blue" style="margin-top:25px; width: auto; min-width: 200px;" onclick="irA('home-screen')">⬅ Volver al Inicio</button>
    </div>

    <script>
        /* ===================== DATOS ORIGINALES RESTAURADOS ===================== */
        const zonasVisuales = ["Bicis", "Lobby", "Resto","Arqueria", "Patio cervecero", "Escaleras", "Camastros", "Kids", "Plaza", "Estatuas", "Pileta", "Plays"];
        
        const zonasData = {
            "Bicis": { e1: "Howie dice que el viento solo se siente real cuando lo perseguís a dos ruedas. Encontrá el QR para continuar.", e2: "Howie estuvo contando rayos y pedales. Dice que para los más aventureros, el equilibrio es un arte. ¿Cuántas bicicletas con rueditas de aprendizaje ves acá?", respuestasValidas: ["ninguna", "cero", "0", "no hay", "0 rueditas"], tipo: "auto" },
            "Lobby": { e1: "Aquí Howie se relaja y se queda mirando a los que llegan y a los que se van. Encontrá el QR para continuar.", e2: "A Howie le preocupa el tiempo. Se quedó mirando el reloj y se pregunta: ¿A qué hora es el último adiós a la habitación?", respuestasValidas: ["diez", "10", "10:00", "10 am", "las diez"], tipo: "auto" },
            "Resto": { e1: "Howie dice que es su lugar favorito, lo que más le gusta es compartir en familia, repasar las anécdotas y que no falten las risas.", e2: "Howie es un gran comensal. Para saber cuál es su plato favorito, en la carta de pizza contá hasta 3.", respuestasValidas: ["especial", "la especial", "pizza especial"], tipo: "auto" },
            "Arqueria": { e1: "Howie dice que la paciencia es como una flecha: cuanto más la tensás, más lejos llegás. Encontrá el QR para continuar.", e2: "Howie estuvo mirando los círculos que nunca terminan: ¿Cuál es el de más valor?", respuestasValidas: ["amarillo", "el amarillo", "centro", "el centro"], tipo: "auto" },
            "Patio cervecero": { e1: "Howie busca la brisa de la tarde y el tintineo de los vasos fríos. Bajo las luces, las historias se cuentan mejor. Encontrá el QR para continuar.", e2: "Howie dice que el suelo está lleno de tesoros pequeños. Usá las piedritas para formar la inicial de la persona que atiende el foodtruck.", respuesta: "PIEDRA", tipo: "foto" },
            "Escaleras": { e1: "Howie siempre se detiene un momento antes de subir. Dice que desde acá las cosas se ven distintas… Encontrá el QR para continuar.", e2: "Howie se queda justo donde el esfuerzo afloja. Desde ahí, los colores cuentan historias de la ciudad. Tomale una foto y envíasela a Howie.", respuesta: "VISTA", tipo: "foto" },
            "Camastros": { e1: "Howie encontró el lugar donde el tiempo se detiene y el sol te abraza en silencio. Encontrá el QR para continuar.", e2: "No siempre es el lugar más ruidoso, pero cuando algo importante pasa, todas las miradas terminan ahí. ¿Sabés qué es?", respuestasValidas: ["escenario", "el escenario", "la tarima"], tipo: "auto" },
            "Kids": { e1: "Howie se siente chiquito otra vez, así que acá se pone a jugar. Encontrá el QR para continuar.", e2: "Tiene cuatro patas, cuida este lugar sin hablar, y cuando esta contento mueve la cola sin parar.", respuestasValidas: ["perro", "perros", "perrito", "perritos", "el perro"], tipo: "auto" },
            "Plaza": { e1: "Howie sigue el rastro de la arena y el sonido de los saltos. Encontrá el QR para continuar.", e2: "Sube a lo mas alto y desde ahí cuenta cuantos balcones tiene el edificio frente a ti.", respuestasValidas: ["16", "dieceis", "dieciséis"], tipo: "auto" },
            "Estatuas": { e1: "Howie se detiene frente a figuras que no se mueven, pero son centro de atracción. Encontrá el QR para continuar.", e2: "El guerrero protege un mensaje. La aprobación está escrita más de una vez. Decinos qué siglas ves.", respuestasValidas: ["aprobado por o.s.n.", "aprobado por osn", "osn", "o.s.n."], tipo: "auto" },
            "Pileta": { e1: "Acá todo es diversión. Howie se acuerda de una regla importante: acá se juega… pero no se corre 😉 Encontrá el QR para continuar.", e2: "No se mete a jugar, pero cuida el juego. Está siempre atento mientras otros chapotean. ¿Quién es?", respuestasValidas: ["guardavidas", "el guardavidas", "bañero", "el bañero", "socorrista"], tipo: "auto" },
            "Plays": { e1: "Howie se dejó llevar por las luces parpadeantes y los sonidos de victoria. Encontrá el QR para continuar.", e2: "Famoso soy, en lo alto estoy, si queres completar el desafío deci que personaje soy.", respuestasValidas: ["cratos", "kratos"], tipo: "auto" }
        };

        let player = { nombre: "", habitacion: "", actualNombre: "", completadas: [] };

        /* ===================== LÓGICA DE NAVEGACIÓN ===================== */
        function irA(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            const target = document.getElementById(id);
            if(target) target.classList.add("active");
            if (id === "mapa-screen") renderMapa();
            if (id === "album-screen") renderAlbum();
            window.scrollTo(0, 0);
        }

        function seleccionarNuevaMision() {
            const restantes = zonasVisuales.filter(z => !player.completadas.includes(z));
            player.actualNombre = restantes.length > 0 ? restantes[Math.floor(Math.random() * restantes.length)] : "¡FINAL!";
            localStorage.setItem("howie", JSON.stringify(player));
        }

        function comenzarJuego() {
            const n = document.getElementById("inputNombre").value.trim();
            const h = document.getElementById("inputHabitacion").value.trim();
            if(!n || !h) { Swal.fire("¡Opa!", "Completá tus datos para empezar", "warning"); return; }
            player.nombre = n; player.habitacion = h; player.completadas = [];
            seleccionarNuevaMision();
            
            const saludo = document.getElementById("saludo");
            if(saludo) saludo.innerText = `¡Hola ${player.nombre}!`;
            
            irA("home-screen");
        }

        function renderMapa() {
            const lista = document.getElementById("listaZonas");
            lista.innerHTML = "";
            zonasVisuales.forEach(z => {
                const div = document.createElement("div");
                div.className = "zona-item";
                if(z === player.actualNombre) {
                    div.innerHTML = `<span>⭐ <b>${z}</b> (Misión Actual)</span>`;
                    div.style.border = "3px solid #F57C00"; div.style.background = "#fff9c4";
                    div.onclick = () => entrarZona(z);
                    div.style.cursor = "pointer";
                } else {
                    const completada = player.completadas.includes(z);
                    if (completada) {
                        div.className = "zona-item zona-completada";
                        div.innerHTML = `<span>${z}</span> <span class="txt-completado">Completado</span>`;
                    } else {
                        div.innerHTML = `<span>🔒 ${z}</span>`;
                        div.style.opacity = "0.5";
                    }
                }
                lista.appendChild(div);
            });
        }

        function entrarZona(z) {
            const data = zonasData[z];
            document.getElementById("zonaTitulo").innerText = z;
            document.getElementById("textoEstado1").innerText = data.e1;
            document.getElementById("textoEstado2").innerText = data.e2;
            document.getElementById("seccionFoto").style.display = (data.tipo === "foto") ? "block" : "none";
            document.getElementById("seccionInput").style.display = (data.tipo === "foto") ? "none" : "block";
            mostrarEstado(1);
            irA("zona-screen");
        }

        function mostrarEstado(n) {
            document.getElementById("estado1").style.display = (n===1)?"block":"none";
            document.getElementById("estado2").style.display = (n===2)?"block":"none";
            if(n===3) {
                if(!player.completadas.includes(player.actualNombre)) {
                    player.completadas.push(player.actualNombre);
                    confetti({ particleCount: 150, origin: { y: 0.7 }, colors: ['#004A97', '#F57C00', '#ffffff'] });
                    Swal.fire({
                        title: "¡Excelente!",
                        text: `Ganaste la figurita de ${player.actualNombre}`,
                        icon: "success",
                        confirmButtonText: "Ver mi Álbum",
                        confirmButtonColor: "#F57C00"
                    }).then(() => {
                        seleccionarNuevaMision();
                        irA("album-screen");
                    });
                }
            }
        }

        function validarRespuesta() {
            const data = zonasData[player.actualNombre];
            const val = document.getElementById("respuestaInput").value.trim().toLowerCase();
            const ok = data.tipo === "auto" ? data.respuestasValidas.includes(val) : val === data.respuesta.toLowerCase();
            if(ok) { document.getElementById("respuestaInput").value=""; mostrarEstado(3); }
            else { Swal.fire("Mmm...", "Howie dice que revises bien el dato e intentá de nuevo", "error"); }
        }

        function renderAlbum() {
            const cont = document.getElementById("contenedorFiguritas");
            cont.innerHTML = "";
            zonasVisuales.forEach(z => {
                const div = document.createElement("div");
                div.className = "sticker-slot";
                if(player.completadas.includes(z)) {
                    const img = z.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                    // IMPORTANTE: Asegurate que tus imagenes sean .jpg
                    div.innerHTML = `<img src="img/${img}.jpg" class="img-sticker">`;
                } else { div.innerHTML = "🔒"; }
                cont.appendChild(div);
            });
        }

        function iniciarEscaneo() {
            const reader = document.getElementById("reader");
            reader.style.display = "block";
            const scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                scanner.stop().then(() => {
                    reader.style.display = "none";
                    if(text.toLowerCase().includes(player.actualNombre.toLowerCase())) mostrarEstado(2);
                    else Swal.fire("Zona Incorrecta", "Este QR no es de " + player.actualNombre, "warning");
                });
            }).catch(() => Swal.fire("Error", "No se detecta la cámara o permiso denegado", "error"));
        }

        function previsualizarFoto(input) {
            if (input.files && input.files[0]) {
                Swal.fire({
                    title: "¡Foto Lista!",
                    text: "Enviando misión a Howie...",
                    icon: "success",
                    confirmButtonText: "Abrir WhatsApp",
                    confirmButtonColor: "#25D366"
                }).then(() => {
                    const msg = encodeURIComponent(`¡Howie! Misión cumplida en ${player.actualNombre}. Soy ${player.nombre}.`);
                    window.open(`https://wa.me/5493541215391?text=${msg}`, '_blank');
                    // Mostramos la seccion de input para que pongan la respuesta/código que les dará el profe
                    document.getElementById("seccionInput").style.display = "block";
                    // mostrarEstado(3); // Ya no pasamos a estado 3 directo, esperamos validacion
                });
            }
        }

        function cerrarSesion() {
            Swal.fire({ 
                title: '¿Cerrar Juego?', 
                text: "Se perderá el progreso actual de figuritas.", 
                icon: 'warning',
                showCancelButton: true, 
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#d33'
            }).then(r => { if(r.isConfirmed) { localStorage.clear(); window.location.reload(); } });
        }

        window.onload = () => {
            const saved = localStorage.getItem("howie");
            if(saved) { 
                player = JSON.parse(saved); 
                const saludo = document.getElementById("saludo");
                if(saludo) saludo.innerText = `¡Hola ${player.nombre}!`;
                irA("home-screen"); 
            } else {
                irA("login-screen");
            }
        };
    </script>
</body>
</html>
