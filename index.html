<!DOCTYPE html>
<html lang="es">
<head>
  <script src="https://unpkg.com/html5-qrcode"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Howie GO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
}

.screen {
  display: none;
  padding: 20px;
}

.screen.active {
  display: block;
}

.card {
  background: white;
  max-width: 480px;
  margin: 40px auto;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  text-align: center;
}

button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.btn-main {
  background: #4CAF50;
  color: white;
  font-weight: bold;
}

input {
  width: 90%;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 16px;
}

.zona-item {
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  border: 1px solid #ccc;
  display: flex;
  justify-content: space-between;
}
/* Contenedor del escáner */
#reader {
  width: 100% !important;
  max-width: 350px;
  margin: 15px auto;
  border: 4px solid #fbc02d; /* Color amarillo Howie */
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* El video dentro del escáner */
#reader video {
  border-radius: 10px;
  object-fit: cover;
}

/* Botón de Escanear (para que resalte) */
#btnAbrirScanner {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  background: #fbc02d;
  color: #333;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: transform 0.2s;
}

#btnAbrirScanner:active {
  transform: scale(0.95);
}
#contenedorStickers {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 3 por fila */
  gap: 12px;
  padding: 15px;
  background: #f0f0f0; /* Fondo gris claro como álbum de papel */
}

.sticker-slot {
  aspect-ratio: 2 / 3; /* Proporción vertical (tipo figurita) */
  background: #ddd;
  border-radius: 8px;
  border: 2px dashed #bbb;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.sticker-slot.ganada {
  border: none;
  background: white;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Sombrita de papel pegado */
}

.sticker-img {
  width: 92%; /* Pequeño margen blanco alrededor como figurita real */
  height: 92%;
  object-fit: cover; /* Para que llene el espacio sin deformarse */
  border-radius: 4px;
}

.numero-guia {
  font-weight: bold;
  color: #aaa;
  font-size: 20px;
}

/* Efecto de brillo al aparecer */
.bounceIn {
  animation: appearance 0.6s ease-out;
}

@keyframes appearance {
  0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
  70% { transform: scale(1.1) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="card">
    <h1>Howie GO</h1>
    <input id="inputNombre" placeholder="Tu nombre">
    <input id="inputHabitacion" placeholder="Habitación">
    <button class="btn-main" id="loginBtn">COMENZAR</button>
  </div>
</div>

<!-- HOME -->
<div id="home-screen" class="screen">
  <div class="card">
    <h2 id="saludo"></h2>
    <p id="progreso">Progreso: 0 / 15</p>

    <button class="btn-main" onclick="irA('mapa-screen')">🗺️ MAPA</button>
    <button onclick="irA('album-screen')">📘 ÁLBUM</button>
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</div>

<!-- MAPA -->
<div id="mapa-screen" class="screen">
  <div class="card">
    <h2>Mapa</h2>
    <div id="listaZonas"></div>
    <button onclick="irA('home-screen')">⬅ Volver</button>
  </div>
</div>

<!-- ZONA -->
<div id="zona-screen" class="screen">
  <header>
    <button onclick="irA('mapa-screen')">⬅ Volver</button>
    <h3 id="zonaTitulo"></h3>
    <div style="width:50px;"></div>
  </header>

  <div class="card">
    <div id="estado1">
  <p id="textoEstado1"></p> <button id="btnAbrirScanner" onclick="iniciarEscaneo()" style="background: #fbc02d; color: #333; font-weight: bold;">
    📷 ESCANEAR QR DE HOWIE
  </button>

  <div id="reader" style="width: 100%; margin-top: 15px; border-radius: 10px; overflow: hidden; display: none;"></div>
</div>

    <div id="estado2" style="display:none;">
    <p id="textoEstado2" style="background: #f1f8e9; padding: 15px; border-radius: 10px;"></p>
    
    <div id="seccionFoto" style="display:none; margin-bottom: 15px; text-align: center;">
      <label for="fotoInput" style="display: block; background: #673ab7; color: white; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold;">
          📸 SACAR FOTO DEL DESAFÍO
      </label>
      <input type="file" id="fotoInput" accept="image/*" capture="camera" style="display:none;" onchange="previsualizarFoto(this)">
      
      <div id="previewContenedor" style="margin-top: 10px; display:none;">
          <img id="fotoPreview" src="" style="width: 100%; border-radius: 10px; border: 3px solid #673ab7;">
          <p style="font-size: 12px; color: #666;">¡Buena foto! Ahora pedile el código a Howie por chat.</p>
      </div>
    </div>

    <input type="text" id="respuestaInput" placeholder="Escribí aquí...">
    <button onclick="validarRespuesta()" class="btn-principal">VALIDAR</button>
</div>

    <div id="estado3" style="display:none;">
      <h3>¡CONSEGUIDO!</h3>
      <div style="font-size: 50px;">🖼️</div>
      <button onclick="obtenerRecompensa()" class="btn-principal">SIGUIENTE MISIÓN</button>
    </div>

    <hr style="margin-top: 20px; border: 0; border-top: 1px solid #eee;">
    <button id="btnAyuda" onclick="pedirAyuda()" style="background: #25D366; color: white; font-weight: bold; border-radius: 50px; margin-top: 10px;">
      💬 PEDIR AYUDA A HOWIE
    </button>
  </div>
</div>

<!-- ÁLBUM -->
<div id="album-screen" class="screen" style="display:none;">
  <header>
    <button onclick="irA('home-screen')">⬅ Volver</button>
    <h3>Mi Álbum de Howie</h3>
    <div style="width:50px;"></div>
  </header>
  
  <div class="album-container" id="contenedorFiguritas"></div>
</div>

<style>
  /* Contenedor del Álbum */
  .album-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 columnas para que entren bien en el celu */
    gap: 12px;
    padding: 15px;
    background: #f8f8f8;
  }

  /* Espacio de cada figurita (Vertical 2:3) */
  .sticker-slot {
    aspect-ratio: 2 / 3; 
    background: #e0e0e0;
    border: 2px dashed #bbb;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  /* Cuando ya ganaron el sticker */
  .sticker-slot.ganada {
    border: 2px solid #fbc02d; /* El amarillo de Howie */
    background: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    animation: aparecer 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* La imagen de la figurita .jpg */
  .sticker-img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Llena el espacio sin deformarse */
    display: block;
  }

  /* El número que se ve cuando no tienen la figurita */
  .numero-guia {
    font-weight: bold;
    color: #999;
    font-size: 1.2rem;
  }

  @keyframes aparecer {
    0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
.screen {
    display: none; /* Por defecto todas ocultas */
}

.screen.active {
    display: block !important; /* ¡Esta línea hace que se vea! */
}
</style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    e2: "Howie estuvo mirando los círculos que nunca terminan: ¿Cuál es el de más valor?",

};
 

let player = {
  nombre: "",
  habitacion: "",
  actualNombre: "", 
  completadas: []
};

/* =====================
   NAVEGACIÓN
===================== */
function irA(id) {
  // 1. Manejo de clases para mostrar/ocultar pantallas
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const target = document.getElementById(id);
  if(target) target.classList.add("active");

  // 2. Lógica de renderizado según la pantalla
  if (id === "mapa-screen") {
      renderMapa();
  } else if (id === "album-screen") {
      renderAlbum(); // ¡Esta es la línea que te faltaba!
  }
}
/* =====================
   LOGIN
===================== */
// Usamos addEventListener para asegurar que el botón funcione
document.getElementById("loginBtn").addEventListener("click", () => {
  const n = document.getElementById("inputNombre").value.trim();
  const h = document.getElementById("inputHabitacion").value.trim();
  
  if (!n || !h) {
    alert("Por favor, completá nombre y habitación");
    return;
  }

  player.nombre = n;
  player.habitacion = h;
  player.completadas = [];
  
  // Selección inicial aleatoria del circuito oculto
  const inicioAzar = Math.floor(Math.random() * circuitoOculto.length);
  player.actualNombre = circuitoOculto[inicioAzar];

  localStorage.setItem("howie", JSON.stringify(player));
  iniciarHome();
});

function iniciarHome() {
  document.getElementById("saludo").innerText = `¡Hola ${player.nombre}!`;
  document.getElementById("progreso").innerText = `Progreso: ${player.completadas.length} / 15`;
  irA("home-screen");
}

/* =====================
   MAPA (Aquí se genera la Estrella)
===================== */
function renderMapa() {
  const listaContenedor = document.getElementById("listaZonas");
  listaContenedor.innerHTML = "";

  zonasVisuales.forEach((z) => {
    const div = document.createElement("div");
    div.className = "zona-item";
    div.style.padding = "15px";
    div.style.margin = "10px 0";
    div.style.borderRadius = "10px";
    div.style.display = "flex";
    div.style.justifyContent = "space-between";
    div.style.alignItems = "center";
    div.style.border = "1px solid #ddd";

    // LÓGICA DE LA ESTRELLA
    if (z === player.actualNombre) {
      div.innerHTML = `<span>⭐ <b>${z}</b></span>`;
      div.style.border = "2px solid #fbc02d";
      div.style.background = "#fff9c4";
      div.style.cursor = "pointer";
      div.onclick = () => entrarZona(z);
    } else if (player.completadas.includes(z)) {
      div.innerHTML = `<span>✔ ${z}</span> <span style="color:green; font-size:12px;">Completado</span>`;
      div.style.background = "#e8f5e9";
    } else {
      div.innerHTML = `<span>🔒 ${z}</span>`;
      div.style.opacity = "0.5";
      div.style.background = "#f5f5f5";
    }
    listaContenedor.appendChild(div);
  });
}

function renderAlbum() {
    const contenedor = document.getElementById("contenedorFiguritas");
    if (!contenedor) return;
    
    contenedor.innerHTML = ""; 

    // Dibujamos las 15 figuritas del Howard Johnson Villa Carlos Paz
    zonasVisuales.forEach((zona, index) => {
        const div = document.createElement("div");
        div.className = "sticker-slot"; 
        
        if (player.completadas && player.completadas.includes(zona)) {
            const nombreArchivo = zona.toLowerCase()
                .trim()
                .replace(/\s+/g, '-')
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, ""); 
                
            div.innerHTML = `<img src="img/${nombreArchivo}.jpg" class="sticker-img">`;
            div.classList.add("ganada");
        } else {
            div.innerHTML = `<span class="candado">🔒</span>`;
        }
        contenedor.appendChild(div);
    });

    // MENSAJE DE ÉXITO FINAL (Si completó las 15 zonas)
    if (player.completadas.length === zonasVisuales.length) {
    const mensajeFinal = document.createElement("div");
    mensajeFinal.style.cssText = "grid-column: 1 / -1; background: #fbc02d; padding: 20px; border-radius: 15px; margin-top: 15px; text-align: center; font-weight: bold; border: 2px solid #333;";
    mensajeFinal.innerHTML = `
        <h3 style="margin:0;">¡LO LOGRASTE, EXPLORADOR! 🏆</h3>
        <p style="margin:10px 0;">Completaste todas las misiones de Howie en el hotel.</p>
        <p><b>¡Buscá a los profes de recreación para recibir tu premio!</b></p>
        <div style="font-size: 30px;">🦉🎖️</div>
    `;
    contenedor.appendChild(mensajeFinal);
}
} 


function irA(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "mapa-screen") renderMapa();
  if (id === "album-screen") renderAlbum(); // <--- Agregado
}
/* =====================
   ZONA Y VALIDACIÓN
===================== */
function entrarZona(zona) {
  const data = zonasData[zona];
  document.getElementById("zonaTitulo").innerText = zona;
  document.getElementById("textoEstado1").innerText = data?.e1 || "Buscá el QR.";
  document.getElementById("textoEstado2").innerText = data?.e2 || "Resolvé el desafío.";
  
  // Mostramos u ocultamos la sección de foto según el tipo
  document.getElementById("seccionFoto").style.display = (data.tipo === "foto") ? "block" : "none";
  
  // Limpiamos todo lo anterior
  document.getElementById("previewContenedor").style.display = "none";
  document.getElementById("respuestaInput").value = "";
  document.getElementById("fotoInput").value = "";

  mostrarEstado(1);
  irA("zona-screen");
}

function mostrarEstado(n) {
  // 1. Manejo de visibilidad de los estados
  document.getElementById("estado1").style.display = n === 1 ? "block" : "none";
  document.getElementById("estado2").style.display = n === 2 ? "block" : "none";
  
  // 2. IMPORTANTE: El estado 3 visual (el del emoji 🖼️) lo mantenemos oculto 
  // porque ahora usamos el cartel animado con la foto real.
  document.getElementById("estado3").style.display = "none";

  // 3. Tu línea extra: Ocultamos el botón de ayuda solo si ya ganó
  const btnAyuda = document.getElementById("btnAyuda");
  if (btnAyuda) {
    btnAyuda.style.display = n === 3 ? "none" : "block";
  }

  // 4. DISPARADOR DEL PREMIO: Si llegamos al estado 3, lanzamos el cartel con la foto
  if (n === 3) {
    if (typeof zonaActual !== 'undefined') {
        mostrarPremio(zonaActual); 
    } else {
        // Por si la variable zonaActual se pierde, que no se trabe el juego
        Swal.fire("¡Misión Cumplida!", "¡Conseguiste una nueva figurita!", "success");
    }
  }
}

function validarRespuesta() {
  const r = document.getElementById("respuestaInput").value.trim().toUpperCase();
  const data = zonasData[player.actualNombre];
  
  if(!data) return;

  let esCorrecto = false;

  if (data.tipo === "foto") {
    // Busca la palabra clave específica de cada zona (FIESTA, VUELO, VISTA, etc.)
    esCorrecto = (r === data.respuesta.toUpperCase());
  } else {
    // Lógica automática para las preguntas
    esCorrecto = data.respuestasValidas.some(res => r.toLowerCase().includes(res.toLowerCase()));
  }

  if (esCorrecto) {
    mostrarEstado(3);
  } else {
    alert("¡Howie dice que ese no es el código o respuesta correcta! Intentá de nuevo o pedí ayuda.");
  }
}

// 1. FUNCIÓN PARA MOSTRAR LA FOTO CUANDO LA SACAN
function previsualizarFoto(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const fotoData = e.target.result;
            const previewImg = document.getElementById("fotoPreview");
            const contenedor = document.getElementById("previewContenedor");
            const btn = document.getElementById("btnAyuda");

            if(previewImg) previewImg.src = fotoData;
            if(contenedor) contenedor.style.display = "block";
            
            if(btn) {
                btn.innerHTML = "✅ ENVIAR ESTA FOTO A LOS PROFES";
                btn.style.background = "#25D366";
                btn.style.animation = "pulse 1s infinite";
                // Enganchamos la función de guardado directamente al botón
                btn.onclick = function() {
                    guardarYEnviarAProfes(fotoData);
                };
            }
        }
        reader.readAsDataURL(input.files[0]);
    }
}

// 2. FUNCIÓN PARA GUARDAR EN CELULAR Y ABRIR WHATSAPP
function guardarYEnviarAProfes(imageData) {
    // DESCARGA AUTOMÁTICA AL CELULAR
    const enlace = document.createElement("a");
    enlace.href = imageData;
    enlace.download = `mision-howie-${typeof zonaActual !== 'undefined' ? zonaActual : 'foto'}.png`;
    document.body.appendChild(enlace);
    enlace.click();
    document.body.removeChild(enlace);

    // CARTEL DE SWEETALERT (Asegúrate de tener la librería cargada arriba)
    Swal.fire({
        title: '¡Foto guardada!',
        text: 'La imagen ya está en tu galería. Ahora adjuntala en el chat que se va a abrir.',
        icon: 'success',
        confirmButtonText: 'ABRIR WHATSAPP',
        confirmButtonColor: '#25D366'
    }).then(() => {
        const mensaje = encodeURIComponent(`¡Hola Profes! Acá les mando la foto de mi misión en: ${typeof zonaActual !== 'undefined' ? zonaActual : 'el Hotel'}`);
        // REEMPLAZÁ LAS X POR TU NÚMERO DE WHATSAPP (sin el + ni espacios)
        window.open(`https://wa.me/5493517669480?text=${mensaje}`, '_blank');
    });
}

function obtenerRecompensa() {
  if (!player.completadas.includes(player.actualNombre)) {
    player.completadas.push(player.actualNombre);
  }

  // SALTO CIRCULAR
  const posOculta = circuitoOculto.indexOf(player.actualNombre);
  const siguientePos = (posOculta + 1) % circuitoOculto.length;
  player.actualNombre = circuitoOculto[siguientePos];

  localStorage.setItem("howie", JSON.stringify(player));
  document.getElementById("respuestaInput").value = ""; // Limpiar input
  iniciarHome();
}

function cerrarSesion() {
  if(confirm("¿Cerrar sesión? Se perderá el progreso.")) {
    localStorage.removeItem("howie");
    location.reload();
  }
}

// AUTOLOAD
window.onload = () => {
  const saved = localStorage.getItem("howie");
  
  if (saved) {
    player = JSON.parse(saved);
    iniciarHome(); // Esto muestra el saludo y el progreso

    // Lógica del QR
    const urlParams = new URLSearchParams(window.location.search);
    const zonaDesdeQR = urlParams.get('zona');
    
    if (zonaDesdeQR) {
        // 1. Limpiamos la URL para que no moleste el parámetro al refrescar
        window.history.replaceState({}, document.title, window.location.pathname);
        
        // 2. Limpiamos el nombre: cambiamos guiones por espacios 
        // Ejemplo: "Maquina-de-Espuma" pasa a ser "Maquina de Espuma"
        const zonaLimpia = zonaDesdeQR.replace(/-/g, " ");
        
        // 3. Verificamos si la zona del QR es donde está la estrella actual
        // Usamos toLowerCase() para que no importe si hay mayúsculas distintas
        if (zonaLimpia.toLowerCase() === player.actualNombre.toLowerCase()) {
            entrarZona(player.actualNombre); 
            mostrarEstado(2); // Lo lleva directo al desafío (Estado 2)
        } else {
            // Si escaneó uno que no le tocaba, le avisamos
            alert(`¡Hola! Howie dice que todavía no es momento de ir a "${zonaLimpia}". Tu estrella ⭐ te espera en "${player.actualNombre}".`);
            irA('mapa-screen');
        }
    }
  }
};

function pedirAyuda() {
  const numero = "5493517669480";
  const tieneFoto = document.getElementById("fotoInput").files.length > 0;
  
  let mensaje = "";
  if (tieneFoto) {
    mensaje = `¡Hola Howie! Soy ${player.nombre}. Acá te mando la foto del desafío de ${player.actualNombre}. ¿Me das el código?`;
  } else {
    mensaje = `Hola Howie! Soy ${player.nombre}. Estoy en ${player.actualNombre} y necesito una pista.`;
  }
  
  const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, '_blank');
}
let html5QrCode;

function iniciarEscaneo() {
    // Mostramos el visor y ocultamos el botón
    document.getElementById('reader').style.display = 'block';
    document.getElementById('btnAbrirScanner').style.display = 'none';

    html5QrCode = new Html5Qrcode("reader");
    
    const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0 
    };

    html5QrCode.start(
        { facingMode: "environment" }, 
        config,
        (decodedText) => {
            // El QR trae la URL completa: https://equipodecreacion.github.io/HowieGo/?zona=Lobby
            try {
                const url = new URL(decodedText);
                const zonaParam = url.searchParams.get("zona");
                
                if (zonaParam) {
                    const zonaLimpia = zonaParam.replace(/-/g, " ");

                    if (zonaLimpia.toLowerCase() === player.actualNombre.toLowerCase()) {
                        detenerEscaneo();
                        // ¡Éxito! Como ya estamos en la zona, solo pasamos al desafío
                        mostrarEstado(2); 
                    } else {
                        alert(`Howie dice: "Ese QR es de ${zonaLimpia}, pero tu estrella está en ${player.actualNombre}"`);
                        detenerEscaneo();
                    }
                }
            } catch (e) {
                alert("Este no parece ser un código de Howie.");
            }
        },
        (errorMessage) => { /* Ignorar errores de escaneo constante */ }
    ).catch(err => {
        alert("No se pudo abrir la cámara. Asegurate de dar permisos.");
        document.getElementById('reader').style.display = 'none';
        document.getElementById('btnAbrirScanner').style.display = 'block';
    });
}

function detenerEscaneo() {
    if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
            document.getElementById('reader').style.display = 'none';
            document.getElementById('btnAbrirScanner').style.display = 'block';
        });
    }
}
function mostrarPremio(zona) {
    // 1. Limpieza total del nombre para evitar errores
    const nombreArchivo = zona.toLowerCase()
        .trim()
        .replace(/\s+/g, '-') // Cambia espacios por guiones
        .normalize("NFD")    // Quita acentos
        .replace(/[\u0300-\u036f]/g, "");

    // 2. Ruta de la imagen. 
    
    const rutaImagen = `./img/${nombreArchivo}.jpg`;

    Swal.fire({
        title: '¡CONSEGUIDO!',
        html: `¡Ganaste la figurita de <b>${zona}</b>!`,
        imageUrl: rutaImagen,
        imageWidth: 200,
        imageHeight: 300,
        imageAlt: 'Cargando figurita...',
        confirmButtonText: 'VER MI ÁLBUM',
        confirmButtonColor: '#fbc02d',
        // Si la imagen no carga, este código nos dirá por qué en la consola
        didOpen: () => {
            const img = Swal.getImage();
            img.onerror = () => {
                console.error("No se encontró la imagen en: " + rutaImagen);
            };
        }
    }).then(() => {
        irA('album-screen');
    });
}
