<!DOCTYPE html>
<html lang="es">
<head>
  <script src="https://unpkg.com/html5-qrcode"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Howie GO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
}

.screen {
  display: none;
  padding: 20px;
}

.screen.active {
  display: block;
}

.card {
  background: white;
  max-width: 480px;
  margin: 40px auto;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  text-align: center;
}

button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.btn-main {
  background: #4CAF50;
  color: white;
  font-weight: bold;
}

input {
  width: 90%;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 16px;
}

.zona-item {
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  border: 1px solid #ccc;
  display: flex;
  justify-content: space-between;
}
/* Contenedor del escáner */
#reader {
  width: 100% !important;
  max-width: 350px;
  margin: 15px auto;
  border: 4px solid #fbc02d; /* Color amarillo Howie */
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* El video dentro del escáner */
#reader video {
  border-radius: 10px;
  object-fit: cover;
}

/* Botón de Escanear (para que resalte) */
#btnAbrirScanner {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  background: #fbc02d;
  color: #333;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: transform 0.2s;
}

#btnAbrirScanner:active {
  transform: scale(0.95);
}
#contenedorStickers {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 3 por fila */
  gap: 12px;
  padding: 15px;
  background: #f0f0f0; /* Fondo gris claro como álbum de papel */
}

.sticker-slot {
  aspect-ratio: 2 / 3; /* Proporción vertical (tipo figurita) */
  background: #ddd;
  border-radius: 8px;
  border: 2px dashed #bbb;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.sticker-slot.ganada {
  border: none;
  background: white;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Sombrita de papel pegado */
}

.sticker-img {
  width: 92%; /* Pequeño margen blanco alrededor como figurita real */
  height: 92%;
  object-fit: cover; /* Para que llene el espacio sin deformarse */
  border-radius: 4px;
}

.numero-guia {
  font-weight: bold;
  color: #aaa;
  font-size: 20px;
}

/* Efecto de brillo al aparecer */
.bounceIn {
  animation: appearance 0.6s ease-out;
}

@keyframes appearance {
  0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
  70% { transform: scale(1.1) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="card">
    <h1>Howie GO</h1>
    <input id="inputNombre" placeholder="Tu nombre">
    <input id="inputHabitacion" placeholder="Habitación">
    <button class="btn-main" id="loginBtn">COMENZAR</button>
  </div>
</div>

<!-- HOME -->
<div id="home-screen" class="screen">
  <div class="card">
    <h2 id="saludo"></h2>
    <p id="progreso">Progreso: 0 / 12</p>

    <button class="btn-main" onclick="irA('mapa-screen')">🗺️ MAPA</button>
    <button onclick="irA('album-screen')">📘 ÁLBUM</button>
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</div>

<!-- MAPA -->
<div id="mapa-screen" class="screen">
  <div class="card">
    <h2>Mapa</h2>
    <div id="listaZonas"></div>
    <button onclick="irA('home-screen')">⬅ Volver</button>
  </div>
</div>

<!-- ZONA -->
<div id="zona-screen" class="screen">
  <header>
    <button onclick="irA('mapa-screen')">⬅ Volver</button>
    <h3 id="zonaTitulo"></h3>
    <div style="width:50px;"></div>
  </header>

  <div class="card">
    <div id="estado1">
  <p id="textoEstado1"></p> <button id="btnAbrirScanner" onclick="iniciarEscaneo()" style="background: #fbc02d; color: #333; font-weight: bold;">
    📷 ESCANEAR QR DE HOWIE
  </button>

  <div id="reader" style="width: 100%; margin-top: 15px; border-radius: 10px; overflow: hidden; display: none;"></div>
</div>

    <div id="estado2" style="display:none;">
    <p id="textoEstado2" style="background: #f1f8e9; padding: 15px; border-radius: 10px;"></p>
    
    <div id="seccionFoto" style="display:none; margin-bottom: 15px; text-align: center;">
      <label for="fotoInput" style="display: block; background: #673ab7; color: white; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold;">
          📸 SACAR FOTO DEL DESAFÍO
      </label>
      <input type="file" id="fotoInput" accept="image/*" capture="camera" style="display:none;" onchange="previsualizarFoto(this)">
      
      <div id="previewContenedor" style="margin-top: 10px; display:none;">
          <img id="fotoPreview" src="" style="width: 100%; border-radius: 10px; border: 3px solid #673ab7;">
          <p style="font-size: 12px; color: #666;">¡Buena foto! Ahora pedile el código a Howie por chat.</p>
      </div>
    </div>

    <input type="text" id="respuestaInput" placeholder="Escribí aquí...">
    <button onclick="validarRespuesta()" class="btn-principal">VALIDAR</button>
</div>

    <div id="estado3" style="display:none;">
      <h3>¡CONSEGUIDO!</h3>
      <div style="font-size: 50px;">🖼️</div>
      <button onclick="obtenerRecompensa()" class="btn-principal">SIGUIENTE MISIÓN</button>
    </div>

    <hr style="margin-top: 20px; border: 0; border-top: 1px solid #eee;">
    <button id="btnAyuda" onclick="pedirAyuda()" style="background: #25D366; color: white; font-weight: bold; border-radius: 50px; margin-top: 10px;">
      💬 PEDIR AYUDA A HOWIE
    </button>
  </div>
</div>

<!-- ÁLBUM -->
<div id="album-screen" class="screen" style="display:none;">
  <header>
    <button onclick="irA('home-screen')">⬅ Volver</button>
    <h3>Mi Álbum de Howie</h3>
    <div style="width:50px;"></div>
  </header>
  
  <div class="album-container" id="contenedorFiguritas"></div>
</div>

<style>
  /* Contenedor del Álbum */
  .album-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 columnas para que entren bien en el celu */
    gap: 12px;
    padding: 15px;
    background: #f8f8f8;
  }

  /* Espacio de cada figurita (Vertical 2:3) */
  .sticker-slot {
    aspect-ratio: 2 / 3; 
    background: #e0e0e0;
    border: 2px dashed #bbb;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  /* Cuando ya ganaron el sticker */
  .sticker-slot.ganada {
    border: 2px solid #fbc02d; /* El amarillo de Howie */
    background: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    animation: aparecer 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* La imagen de la figurita .jpg */
  .sticker-img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Llena el espacio sin deformarse */
    display: block;
  }

  /* El número que se ve cuando no tienen la figurita */
  .numero-guia {
    font-weight: bold;
    color: #999;
    font-size: 1.2rem;
  }

  @keyframes aparecer {
    0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
.screen {
    display: none; /* Por defecto todas ocultas */
}

.screen.active {
    display: block !important; /* ¡Esta línea hace que se vea! */
}
</style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
/* =====================
   DATOS DEL JUEGO
===================== */
const zonasVisuales = [
  "Bicis", "Lobby", "Resto","Arqueria", "Patio cervecero", "Escaleras", "Camastros",
  "Kids", "Plaza", "Estatuas", "Pileta", "Plays"
];

const circuitoOculto = [
  "Plaza", "Bicis", "Camastros", 
  "Arqueria", "Kids", "Pileta", "Resto", "Lobby", 
  "Plays", "Escaleras", "Estatuas", "Patio cervecero"
];

const zonasData = {
  "Bicis": {
    e1: "Howie dice que el viento solo se siente real cuando lo perseguís a dos ruedas. Encontrá el QR para continuar.",
    e2: "Howie estuvo contando rayos y pedales. Dice que para los más aventureros, el equilibrio es un arte. ¿Cuántas bicicletas con rueditas de aprendizaje ves acá?",
    respuestasValidas: ["ninguna", "cero", "0", "no hay", "0 rueditas"],
    tipo: "auto"
  },
  "Lobby": {
    e1: "Aquí Howie se relaja y se queda mirando a los que llegan y a los que se van. Encontrá el QR para continuar.",
    e2: "A Howie le preocupa el tiempo. Se quedó mirando el reloj y se pregunta: ¿A qué hora es el último adiós a la habitación?",
    respuestasValidas: ["diez", "10", "10:00", "10 am", "las diez"],
    tipo: "auto"
  },
  "Resto": {
    e1: "Howie dice que es su lugar favorito, lo que más le gusta es compartir en familia, repasar las anécdotas y que no falten las risas.",
    e2: "Howie es un gran comensal. Para saber cuál es su plato favorito, en la carta de pizza contá hasta 3.",
    respuestasValidas: ["especial", "la especial", "pizza especial"],
    tipo: "auto"
  },
  "Arqueria": {
    e1: "Howie dice que la paciencia es como una flecha: cuanto más la tensás, más lejos llegás. Encontrá el QR para continuar.",
    e2: "Howie estuvo mirando los círculos que nunca terminan: ¿Cuál es el de más valor?",
    respuestasValidas: ["amarillo", "el amarillo", "centro", "el centro"],
    tipo: "auto"
  },
  "Patio cervecero": {
    e1: "Howie busca la brisa de la tarde y el tintineo de los vasos fríos. Bajo las luces, las historias se cuentan mejor. Encontrá el QR para continuar.",
    e2: "Howie dice que el suelo está lleno de tesoros pequeños. Usá las piedritas para formar la inicial de la persona que atiende el foodtruck.",
    respuesta: "PIEDRA",
    tipo: "foto"
  },
  "Escaleras": {
    e1: "Howie siempre se detiene un momento antes de subir. Dice que desde acá las cosas se ven distintas… Encontrá el QR para continuar.",
    e2: "Howie se queda justo donde el esfuerzo afloja. Desde ahí, los colores cuentan historias de la ciudad. Tomale una foto y envíasela a Howie.",
    respuesta: "VISTA",
    tipo: "foto"
  },
  "Camastros": {
    e1: "Howie encontró el lugar donde el tiempo se detiene y el sol te abraza en silencio. Encontrá el QR para continuar.",
    e2: "No siempre es el lugar más ruidoso, pero cuando algo importante pasa, todas las miradas terminan ahí. ¿Sabés qué es?",
    respuestasValidas: ["escenario", "el escenario", "la tarima"],
    tipo: "auto"
  },
  "Kids": {
    e1: "Howie se siente chiquito otra vez, así que acá se pone a jugar. Encontrá el QR para continuar.",
    e2: "Tiene cuatro patas, cuida este lugar sin hablar, y cuando esta contento mueve la cola sin parar.",
    respuestasValidas: ["perro", "perros", "perrito", "perritos", "el perro"],
    tipo: "auto"
  },
  "Plaza": {
    e1: "Howie sigue el rastro de la arena y el sonido de los saltos. Encontrá el QR para continuar.",
    e2: "Sube a lo mas alto y desde ahí cuenta cuantos balcones tiene el edificio frente a ti.",
    respuestasValidas: ["16", "dieceis", "dieciséis"],
    tipo: "auto"
  },
  "Estatuas": {
    e1: "Howie se detiene frente a figuras que no se mueven, pero son centro de atracción. Encontrá el QR para continuar.",
    e2: "El guerrero protege un mensaje. La aprobación está escrita más de una vez. Decinos qué siglas ves.",
    respuestasValidas: ["aprobado por o.s.n.", "aprobado por osn", "osn", "o.s.n."],
    tipo: "auto"
  },
  "Pileta": {
    e1: "Acá todo es diversión. Howie se acuerda de una regla importante: acá se juega… pero no se corre 😉 Encontrá el QR para continuar.",
    e2: "No se mete a jugar, pero cuida el juego. Está siempre atento mientras otros chapotean. ¿Quién es?",
    respuestasValidas: ["guardavidas", "el guardavidas", "bañero", "el bañero", "socorrista"],
    tipo: "auto"
  },
  "Plays": {
    e1: "Howie se dejó llevar por las luces parpadeantes y los sonidos de victoria. Encontrá el QR para continuar.",
    e2: "Famoso soy, en lo alto estoy, si queres completar el desafío deci que personaje soy.",
    respuestasValidas: ["cratos", "kratos"],
    tipo: "auto"
  }
};
 

let player = {
  nombre: "",
  habitacion: "",
  actualNombre: "", 
  completadas: []
};

/* =====================
   NAVEGACIÓN
===================== */
function irA(id) {
  // 1. Manejo de clases para mostrar/ocultar pantallas
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const target = document.getElementById(id);
  if(target) target.classList.add("active");

  // 2. Lógica de renderizado según la pantalla
  if (id === "mapa-screen") {
      renderMapa();
  } else if (id === "album-screen") {
      renderAlbum(); // ¡Esta es la línea que te faltaba!
  }
}
/* =====================
   LOGIN
===================== */
// Usamos addEventListener para asegurar que el botón funcione
document.getElementById("loginBtn").addEventListener("click", () => {
  const n = document.getElementById("inputNombre").value.trim();
  const h = document.getElementById("inputHabitacion").value.trim();
  
  if (!n || !h) {
    alert("Por favor, completá nombre y habitación");
    return;
  }

  player.nombre = n;
  player.habitacion = h;
  player.completadas = [];
  
  // Selección inicial aleatoria del circuito oculto
  const inicioAzar = Math.floor(Math.random() * circuitoOculto.length);
  player.actualNombre = circuitoOculto[inicioAzar];

  localStorage.setItem("howie", JSON.stringify(player));
  iniciarHome();
});

function iniciarHome() {
  document.getElementById("saludo").innerText = `¡Hola ${player.nombre}!`;
  document.getElementById("progreso").innerText = `Progreso: ${player.completadas.length} / 12`;
  irA("home-screen");
}


/* =====================
   MAPA (Aquí se genera la Estrella)
===================== */
function mostrarEstado(n) {
  const e1 = document.getElementById("estado1");
  const e2 = document.getElementById("estado2");
  const e3 = document.getElementById("estado3");

  if(e1) e1.style.display = (n === 1) ? "block" : "none";
  if(e2) e2.style.display = (n === 2) ? "block" : "none";
  if(e3) e3.style.display = (n === 3) ? "block" : "none";

  const btnAyuda = document.getElementById("btnAyuda");
  if (btnAyuda) btnAyuda.style.display = (n === 3) ? "none" : "block";

  if (n === 3) {
    // 1. Guardamos la figurita
    obtenerRecompensa();

    // 2. Confeti
    if (typeof confetti === 'function') {
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#fbc02d', '#ffffff', '#4CAF50'],
            zIndex: 9999
        });
    }

    const zonaGanada = player.actualNombre;
    const nombreLimpio = zonaGanada.toLowerCase().trim().replace(/\s+/g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    
    // --- LÓGICA DE CIERRE ---
    const esUltima = player.completadas.length >= 12;

    // 3. Cartel de éxito
    Swal.fire({
        title: esUltima ? '¡ÁLBUM COMPLETADO! 🏆' : '¡CONSEGUIDO!',
        text: esUltima ? '¡Lo lograste! Avisale a los profes para retirar tu premio.' : `¡Ganaste la figurita de ${zonaGanada}!`,
        imageUrl: `./img/${nombreLimpio}.jpg`,
        imageWidth: 200,
        imageHeight: 300,
        confirmButtonText: esUltima ? '🎁 RECLAMAR PREMIO' : 'VER MI ÁLBUM',
        confirmButtonColor: esUltima ? '#4CAF50' : '#fbc02d',
        allowOutsideClick: false
    }).then(() => {
        if (esUltima) {
            // WHATSAPP FINAL
            const mensajeFinal = encodeURIComponent(`¡TERMINÉ HOWIE-GO! 🏆\n\nNombre: ${player.nombre}\nHabitación: ${player.habitacion}\n¡Ya tengo las 12 figuritas!`);
            window.open(`https://wa.me/5493541215391?text=${mensajeFinal}`, '_blank');
        } else {
            // MOTOR DE MOVIMIENTO NORMAL
            const posActual = circuitoOculto.indexOf(player.actualNombre);
            const siguientePos = (posActual + 1) % circuitoOculto.length;
            player.actualNombre = circuitoOculto[siguientePos];
            localStorage.setItem("howie", JSON.stringify(player));
        }

        irA('album-screen');
    });
  }
}

function renderAlbum() {
    const contenedor = document.getElementById("contenedorFiguritas");
    if (!contenedor) return;
    
    contenedor.innerHTML = ""; 

    zonasVisuales.forEach((zona) => {
        const div = document.createElement("div");
        div.className = "sticker-slot"; 
        
        // LIMPIEZA PARA COMPARAR: Pasamos todo a minúsculas y sacamos espacios
        const zonaParaComparar = zona.trim().toLowerCase();
        const estaGanada = player.completadas.some(c => c.trim().toLowerCase() === zonaParaComparar);

        if (estaGanada) {
            // Generamos el nombre del archivo (mismo proceso que ya tenías)
            const nombreArchivo = zonaParaComparar
                .replace(/\s+/g, '-')
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, ""); 
                
            div.innerHTML = `<img src="img/${nombreArchivo}.jpg" class="sticker-img">`;
            div.classList.add("ganada");
        } else {
            div.innerHTML = `<span class="candado">🔒</span>`;
        }
        contenedor.appendChild(div);
    });

    // MENSAJE DE ÉXITO FINAL
    if (player.completadas.length >= 12) { // Usamos >= para mayor seguridad
        const mensajeFinal = document.createElement("div");
        mensajeFinal.style.cssText = "grid-column: 1 / -1; background: #fbc02d; padding: 20px; border-radius: 15px; margin-top: 15px; text-align: center; font-weight: bold; border: 2px solid #333; color: #333;";
        mensajeFinal.innerHTML = `
            <h3 style="margin:0;">¡LO LOGRASTE, EXPLORADOR! 🏆</h3>
            <p style="margin:10px 0;">Completaste todas las misiones de Howie en el hotel.</p>
            <p><b>¡Buscá a los profes de recreación para recibir tu premio!</b></p>
            <div style="font-size: 30px;">🦉🎖️</div>
        `;
        contenedor.appendChild(mensajeFinal);
    }
}


function irA(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "mapa-screen") renderMapa();
  if (id === "album-screen") renderAlbum(); // <--- Agregado
}

/* =====================
   ZONA Y VALIDACIÓN
===================== */
function entrarZona(zona) {
 const data = zonasData[zona];
 if (!data) return;

 document.getElementById("zonaTitulo").innerText = zona;
 document.getElementById("textoEstado1").innerText = data.e1 || "Buscá el QR.";
 document.getElementById("textoEstado2").innerText = data.e2 || "Resolvé el desafío.";
 
 document.getElementById("seccionFoto").style.display = (data.tipo === "foto") ? "block" : "none";
 
 document.getElementById("previewContenedor").style.display = "none";
 document.getElementById("respuestaInput").value = "";
 document.getElementById("fotoInput").value = "";

 mostrarEstado(1);
 irA("zona-screen");
}

function validarRespuesta() {
    const zona = player.actualNombre;
    // Buscamos la data de la zona ignorando mayúsculas/minúsculas
    const data = zonasData[zona]; 
    const inputElement = document.getElementById("respuestaInput");
    
    if (!inputElement) return;
    const valorEscrito = inputElement.value.trim().toLowerCase();

    if (!data) {
        console.error("No hay datos para la zona:", zona);
        // TRUCO DE EMERGENCIA: Si no hay data, intentamos validar igual con obtenerRecompensa
        Swal.fire('Error de Configuración', 'No se encontró la data de ' + zona, 'error');
        return;
    }

    let esCorrecto = false;

    // Validación según el tipo de desafío
    if (data.tipo === "auto") {
        // Validación para respuestas múltiples (ej: números)
        if (data.respuestasValidas) {
            esCorrecto = data.respuestasValidas.some(r => r.toString().toLowerCase() === valorEscrito);
        }
    } else {
        // Validación para códigos de WhatsApp (ej: VISTA, NATATORIO)
        if (data.respuesta) {
            esCorrecto = (valorEscrito === data.respuesta.toLowerCase());
        }
    }

    if (esCorrecto) {
        // 1. SUMAMOS EL PUNTO (Esto mueve la estrella y guarda en el celu)
        obtenerRecompensa(); 
        
        // 2. FESTEJO
        mostrarEstado(3); 
        
        // Limpiamos el input para la próxima zona
        inputElement.value = "";
    } else {
        Swal.fire({
            title: 'Código Incorrecto',
            text: 'Howie dice que revises bien el código que te pasaron.',
            icon: 'warning',
            confirmButtonColor: '#004A97' // Color Howard Johnson
        });
    }
}

function previsualizarFoto(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            // 1. Mostrar miniatura
            const img = document.getElementById("fotoPreview");
            const cont = document.getElementById("previewContenedor");
            if (img) img.src = e.target.result;
            if (cont) cont.style.display = "block";
            
            // 2. Transformar el botón verde COMPLETAMENTE
            const btnAyuda = document.getElementById("btnAyuda");
            if (btnAyuda) {
                btnAyuda.innerText = "💬 ENVIAR FOTO A HOWIE";
                btnAyuda.style.background = "#25D366";
                
                // Forzamos a que el botón use la nueva lógica de envío
                btnAyuda.onclick = function() {
                    ejecutarEnvioFinal(e.target.result);
                };
            }
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function ejecutarEnvioFinal(base64Image) {
    // 1. DESCARGA REAL
    const link = document.createElement("a");
    link.href = base64Image;
    link.download = `Mision_Howie_${player.actualNombre}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // 2. CARTEL DE AVISO
    Swal.fire({
        title: '¡Foto Guardada!',
        text: 'La imagen ya está en tu galería. Ahora adjuntala en WhatsApp.',
        icon: 'success',
        confirmButtonText: 'ABRIR WHATSAPP',
        confirmButtonColor: '#25D366'
    }).then(() => {
        // 3. WHATSAPP CON TEXTO ACTUALIZADO
        const mensaje = encodeURIComponent(`¡Hola Howie! Soy ${player.nombre}. Acá te mando la foto de mi misión en: ${player.actualNombre}.`);
        window.open(`https://wa.me/5493541215391?text=${mensaje}`, '_blank');

        // --- RESETEO DEL BOTÓN AQUÍ ADENTRO ---
        const btnAyuda = document.getElementById("btnAyuda");
        if (btnAyuda) {
            btnAyuda.innerText = "PEDIR AYUDA A HOWIE";
            btnAyuda.style.background = "#004A97"; // El azul Howard Johnson
            btnAyuda.onclick = pedirAyuda; // Reconectamos la función original
        }
    });
}


/* =====================
    ESTADOS Y MOVIMIENTO
===================== */
function mostrarEstado(n) {
  const e1 = document.getElementById("estado1");
  const e2 = document.getElementById("estado2");
  const e3 = document.getElementById("estado3");

  if(e1) e1.style.display = (n === 1) ? "block" : "none";
  if(e2) e2.style.display = (n === 2) ? "block" : "none";
  if(e3) e3.style.display = (n === 3) ? "block" : "none";

  const btnAyuda = document.getElementById("btnAyuda");
  if (btnAyuda) btnAyuda.style.display = (n === 3) ? "none" : "block";

  if (n === 3) {
    // 1. Guardamos la figurita que acaba de ganar
    obtenerRecompensa();

    // 2. Confeti
    if (typeof confetti === 'function') {
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#fbc02d', '#ffffff', '#4CAF50'],
            zIndex: 9999
        });
    }

    const zonaGanada = player.actualNombre;
    const nombreLimpio = zonaGanada.toLowerCase().trim().replace(/\s+/g, '-').normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    
    // --- CHEQUEO DE FINAL DE JUEGO ---
    const esElFinal = player.completadas.length >= 12;

    // 3. Cartel de éxito adaptado
    Swal.fire({
        title: esElFinal ? '¡ÁLBUM COMPLETADO! 🏆' : '¡CONSEGUIDO!',
        text: esUltima ? `¡Lo lograste, ${player.nombre}! Completaste las 12 misiones del Howard Johnson.` : `¡Ganaste la figurita de ${zonaGanada}!`,
        imageUrl: `./img/${nombreLimpio}.jpg`,
        imageWidth: 200,
        imageHeight: 300,
        confirmButtonText: esElFinal ? '🎁 RECLAMAR MI PREMIO' : 'VER MI ÁLBUM',
        confirmButtonColor: esElFinal ? '#4CAF50' : '#fbc02d', // Verde para el premio
        allowOutsideClick: false
    }).then(() => {
        if (esElFinal) {
            // MENSAJE PARA LOS PROFES
            const mensajeFinal = encodeURIComponent(`¡TERMINÉ EL JUEGO! 🏆\n\nNombre: ${player.nombre}\nHabitación: ${player.habitacion}\nEstado: Álbum Completo (12/12)`);
            window.open(`https://wa.me/5493541215391?text=${mensajeFinal}`, '_blank');
        } else {
            // MOTOR DE MOVIMIENTO NORMAL (Solo si no terminó)
            const posActual = circuitoOculto.indexOf(player.actualNombre);
            const siguientePos = (posActual + 1) % circuitoOculto.length;
            player.actualNombre = circuitoOculto[siguientePos];
            localStorage.setItem("howie", JSON.stringify(player));
        }

        // En ambos casos, vamos al álbum para que vea su progreso final
        irA('album-screen');
    });
  }
}

/* =====================
    CIERRE DE SESIÓN SEGURO
===================== */
function cerrarSesion() {
    Swal.fire({
        title: '¿Cerrar sesión?',
        text: "Se borrará todo tu progreso en Howard Johnson. ¿Estás seguro?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sí, borrar todo',
        cancelButtonText: 'No, seguir jugando'
    }).then((result) => {
        if (result.isConfirmed) {
            localStorage.clear();
            window.location.reload();
        }
    });
}

// --- 1. GESTIÓN DE PROGRESO Y RECOMPENSA ---
function obtenerRecompensa() {
    // 1. Aseguramos que la lista exista
    if (!player.completadas) player.completadas = [];

    // 2. Guardamos la zona que acaba de ganar (la actual)
    // USAMOS UNA VARIABLE PARA QUE NO SE MUEVA TODAVÍA
    const zonaGanada = player.actualNombre;

    if (!player.completadas.includes(zonaGanada)) {
        player.completadas.push(zonaGanada);
    }

    // --- EL CAMBIO ESTÁ AQUÍ ---
    // NO movemos la estrella todavía. Dejamos que el usuario vea su premio.
    // Solo guardamos el estado actual.
    
    localStorage.setItem("howie", JSON.stringify(player));
    
    // 3. Actualizamos la interfaz para que diga 1/12, 2/12, etc.
    actualizarInterfazHome();

    // 4. Si el álbum está abierto, que se refresque con la nueva figu
    if (typeof renderAlbum === 'function') renderAlbum();
}

function actualizarInterfazHome() {
    const p = document.getElementById("progreso");
    if (p && player.completadas) {
        p.innerText = `Progreso: ${player.completadas.length} / 12`;
    }
}

// --- 2. ESCÁNER QR (SIN LOOPS Y CON CIERRE SEGURO) ---
let html5QrCode = null;
let escaneando = false; 

async function iniciarEscaneo() {
    const readerDiv = document.getElementById('reader');
    if (!readerDiv) return;

    readerDiv.style.display = 'block';
    const btnScan = document.getElementById('btnAbrirScanner');
    if (btnScan) btnScan.style.display = 'none';

    if (html5QrCode) {
        try { await html5QrCode.stop(); } catch (e) {}
        html5QrCode = null;
    }

    setTimeout(() => {
        escaneando = true;
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                if (!escaneando) return;
                escaneando = false; 
                detenerEscaneo(); 
                procesarLecturaQR(decodedText);
            }
        ).catch(err => console.error("Error cámara:", err));
    }, 300);
}

function detenerEscaneo() {
    if (html5QrCode) {
        html5QrCode.stop().then(() => {
            html5QrCode = null;
            document.getElementById('reader').style.display = 'none';
            const btnScan = document.getElementById('btnAbrirScanner');
            if (btnScan) btnScan.style.display = 'block';
        }).catch(() => {
            document.getElementById('reader').style.display = 'none';
        });
    }
}

function procesarLecturaQR(decodedText) {
    try {
        let zonaLeida = "";
        if (decodedText.includes("zona=")) {
            const url = new URL(decodedText);
            zonaLeida = url.searchParams.get("zona").replace(/-/g, " ");
        } else {
            zonaLeida = decodedText;
        }

        if (zonaLeida.toLowerCase() === player.actualNombre.toLowerCase()) {
            setTimeout(() => { mostrarEstado(2); }, 300);
        } else {
            Swal.fire('Zona Equivocada', `Buscá: ${player.actualNombre}`, 'warning');
        }
    } catch (e) {
        console.error("Error QR:", e);
    }
}

// --- 3. INICIO Y AYUDA ---
window.onload = () => {
    const saved = localStorage.getItem("howie");
    if (saved) {
        player = JSON.parse(saved);
        actualizarInterfazHome();
        if (typeof iniciarHome === 'function') iniciarHome();
    }
};

function pedirAyuda() {
    const mensaje = encodeURIComponent(`¡Hola Howie! Soy ${player.nombre}. Estoy en ${player.actualNombre} y necesito una pista.`);
    window.open(`https://wa.me/5493541215391?text=${mensaje}`, '_blank');
}

// Forzar que el contador se actualice siempre al cargar
document.addEventListener('DOMContentLoaded', () => {
    const p = document.getElementById("progreso");
    if (p && player && player.completadas) {
        p.innerText = `Progreso: ${player.completadas.length} / 12`;
    }
});
