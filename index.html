<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HowieGO - Howard Johnson</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --azul: #004A97; --naranja: #F57C00; --fondo: #f8f9fa; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: var(--fondo); color: #333; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; min-height: 100vh; width: 100%; box-sizing: border-box; padding: 20px; flex-direction: column; align-items: center; position: relative; }
        .screen.active { display: flex; }
        
        #login-screen { background: linear-gradient(135deg, var(--azul) 0%, #002d5c 100%); justify-content: center; }
        .card-login { background: white; padding: 30px; border-radius: 25px; width: 85%; max-width: 340px; text-align: center; border: 4px solid var(--naranja); box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .howie-container { position: relative; width: 120px; height: 130px; margin: 0 auto 15px; }
        .howie-cuerpo { width: 100%; position: absolute; bottom: 0; left: 0; z-index: 1; }
        .ala-animada { width: 100px; position: absolute; top: 20px; left: 12px; z-index: 2; transform-origin: 30% 70%; animation: saludo 2s ease-in-out infinite; }
        @keyframes saludo { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } }
        .logo-txt { font-size: 32px; font-weight: 900; color: var(--azul); margin: 5px 0; text-transform: uppercase; }
        .logo-go { color: var(--naranja); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; }

        .btn-home { width: 92%; max-width: 320px; height: 110px; border-radius: 25px; margin: 15px 0; border: none; cursor: pointer; position: relative; color: white; display: flex; align-items: center; padding: 0 25px; z-index: 5; }
        #btn-mapa { background: var(--naranja); text-align: left; box-shadow: 0 6px 15px rgba(245,124,0,0.3); }
        #btn-album { background: var(--azul); text-align: right; justify-content: flex-end; box-shadow: 0 6px 15px rgba(0,74,151,0.3); }
        .sticker-img { position: absolute; width: 155px; bottom: -15px; z-index: 10; pointer-events: none; }
        .pos-der { right: -25px; }
        .pos-izq { left: -25px; transform: scaleX(-1); }

        .zona-item { width: 100%; background: white; margin: 10px 0; padding: 15px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; border: 2px solid transparent; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .zona-actual { border-color: var(--naranja); background: #fff9e6; }
        .zona-hecha { background: #e8f5e9; color: #2e7d32; border-color: #c8e6c9; }

        .card-mision { background: white; width: 100%; max-width: 360px; padding: 25px; border-radius: 25px; border: 4px solid var(--naranja); text-align: center; box-sizing: border-box; }
        .btn-hj { background: var(--naranja); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: bold; width: 100%; margin: 10px 0; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        #reader { width: 100%; border-radius: 15px; margin-top: 15px; display: none; overflow: hidden; border: 3px solid var(--naranja); background: #000; min-height: 250px; }
        #preview-foto { width: 160px; height: auto; border-radius: 15px; margin: 15px auto; display: none; border: 4px solid var(--naranja); }
        .grid-album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 350px; margin: 20px auto; }
        .slot-figu { width: 100%; aspect-ratio: 2/3; background: #e0e0e0; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px dashed #999; overflow: hidden; position: relative; }
        .slot-figu img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="card-login">
            <div class="howie-container">
                <img src="img/howie-cuerpo.png" class="howie-cuerpo">
                <img src="img/howie-ala.png" class="ala-animada">
            </div>
            <h1 class="logo-txt">Howie<span class="logo-go">GO</span></h1>
            <input type="text" id="inputNombre" placeholder="Tu Nombre">
            <input type="text" id="inputHab" placeholder="Nro Habitación">
            <button class="btn-hj" onclick="comenzar()">¡EMPEZAR!</button>
        </div>
    </div>

    <div id="home-screen" class="screen">
        <h1 id="saludo">HOLA</h1>
        <p>¡Vamos a la aventura! 🦉✨</p>
        <button id="btn-mapa" class="btn-home" onclick="irA('mapa-screen')"><div><span>Misiones</span><b>VER MAPA</b></div><img src="img/boton-mapa.png" class="sticker-img pos-der"></button>
        <button id="btn-album" class="btn-home" onclick="irA('album-screen')"><img src="img/boton-album.png" class="sticker-img pos-izq"><div><span>Mis Figus</span><b>MI ÁLBUM</b></div></button>
        <div id="cont-campeon" style="display:none; width:100%; text-align:center;"><button class="btn-hj" style="background:#4CAF50; width:92%;" onclick="reclamarPremio()">🎁 ¡RECLAMAR MI PREMIO!</button></div>
        <button onclick="cerrarSesion()" style="background:none; border:none; color:#999; text-decoration:underline; margin-top:50px; cursor:pointer;">Cerrar Sesión</button>
    </div>

    <div id="mapa-screen" class="screen"><h2 style="color:var(--azul)">MAPA DE MISIONES</h2><div id="listaZonas" style="width:100%"></div><button class="btn-hj" onclick="irA('home-screen')" style="background:var(--azul); width:85%">⬅ VOLVER</button></div>

    <div id="mision-screen" class="screen">
        <div class="card-mision">
            <h2 id="m-titulo" style="color:var(--naranja); margin:0; text-transform:uppercase;"></h2>
            <p id="m-texto" style="font-size:16px; margin:20px 0; color:#444;"></p>
            <div id="cont-e1">
                <button id="btn-scan" class="btn-hj" onclick="abrirEscaner()">🔍 ABRIR ESCÁNER</button>
                <div id="reader"></div>
            </div>
            <div id="cont-e2" style="display:none;">
                <img id="preview-foto" src="">
                <div id="cont-respuesta">
                    <input type="text" id="res-input" placeholder="Tu respuesta...">
                    <button class="btn-hj" onclick="validarRespuesta()">ENVIAR RESPUESTA</button>
                </div>
                <div id="modo-foto" style="display:none;">
                    <input type="file" id="input-foto" accept="image/*" capture="camera" style="display:none;" onchange="fotoCapturada(event)">
                    <button class="btn-hj" onclick="document.getElementById('input-foto').click()">📸 TOMAR FOTO DEL DESAFÍO</button>
                </div>
            </div>
            <button id="btn-ayuda-wa" class="btn-hj" style="background:var(--azul); width:85%; font-size:14px;" onclick="ayudaWA()">🆘 PEDIR AYUDA</button>
        </div>
        <button class="btn-hj" onclick="irA('mapa-screen')" style="background:var(--azul); width:85%; margin-top:20px;">⬅ VOLVER AL MAPA</button>
    </div>

    <div id="e3-screen" class="screen">
        <div class="card-mision" style="border-color:#4CAF50; padding:35px;"><h2 id="e3-tit" style="color:#4CAF50; margin:0;">¡EXCELENTE! 🎉</h2><p id="e3-txt" style="margin:15px 0; color:#555;"></p><div id="figu-slot" class="slot-figu" style="width:160px; height:240px; margin:20px auto; border:4px solid #4CAF50;"></div><button class="btn-hj" style="background:#4CAF50" onclick="irA('album-screen')">📖 VER MI ÁLBUM</button></div>
    </div>

    <div id="album-screen" class="screen"><h2>MI ÁLBUM HOWIEGO</h2><div id="grid-album" class="grid-album"></div><button class="btn-hj" style="background:var(--azul); width:90%" onclick="irA('home-screen')">🏠 INICIO</button></div>

    <script>
        const zonas = ["Bicis", "Lobby", "Resto", "Arqueria", "Quinchos", "Escaleras", "Camastros", "Kids", "Plaza", "Estatuas", "Pileta", "Plays"];
        const misiones = {
            "Bicis": { e1: "Howie dice que el viento solo se siente real cuando lo perseguís a dos ruedas. Encontrá el QR para continuar.", e2: "Howie estuvo contando rayos y pedales. Dice que para los más aventureros, el equilibrio es un arte. ¿Cuántas bicicletas con rueditas de aprendizaje ves acá?", r: ["0", "cero", "ninguna"] },
            "Lobby": { e1: "Aquí Howie se relaja y se queda mirando a los que llegan y a los que se van. Encontrá el QR para continuar.", e2: "A Howie le preocupa el tiempo. Se quedó mirando el reloj y se pregunta: ¿A qué hora es el último adiós a la habitación?", r: ["10", "diez", "las 10"] },
            "Resto": { e1: "Howie dice que es su lugar favorito, lo que más le gusta es compartir en familia, repasar las anécdotas y que no falten las risas. Encontrá el QR para continuar.", e2: "Howie es un gran comensal. Para saber cuál es su plato favorito, en la carta de pizza contá hasta 3.", r: ["especial", "la especial"] },
            "Arqueria": { e1: "Howie dice que la paciencia es como una flecha: cuanto más la tensás, más lejos llegás. Encontrá el QR para continuar.", e2: "Howie estuvo mirando los círculos que nunca terminan: ¿Cuál es el de más valor?", r: ["amarillo", "el amarillo"] },
            "Quinchos": { e1: "Howie busca la brisa de la tarde y un refujio del sol. Encontrá el QR para continuar.", e2: "Howie dice que hay un asiento que es super especial, Sacate una foto siendo Rey/Reina.", tipo: "foto", r: ["foto"] },
            "Escaleras": { e1: "Howie siempre se detiene un momento antes de subir. Dice que desde acá las cosas se ven distintas… Encontrá el QR para continuar.", e2: "Howie se queda justo donde el esfuerzo afloja. Desde ahí, los colores cuentan historias de la ciudad. Tomale una foto y envíasela a Howie.", tipo: "foto", r: ["foto"] },
            "Camastros": { e1: "Howie encontró el lugar donde el tiempo se detiene y el sol te abraza en silencio. Encontrá el QR para continuar.", e2: "No siempre es el lugar más ruidoso, pero cuando algo importante pasa, todas las miradas terminan ahí. ¿Sabés qué es?", r: ["escenario", "el escenario"] },
            "Kids": { e1: "Howie se siente chiquito otra vez, así que acá se pone a jugar. Encontrá el QR para continuar.", e2: "Tiene cuatro patas, cuida este lugar sin hablar, y cuando está contento mueve la cola sin parar.", r: ["perro", "perros", "perrito"] },
            "Plaza": { e1: "Howie sigue el rastro de la arena y el sonido de los saltos. Encontrá el QR para continuar.", e2: "Sube a lo mas alto y desde ahí cuenta cuantos balcones tiene el edificio frente a ti.", r: ["16", "dieciseis"] },
            "Estatuas": { e1: "Figuras que no se mueven, pero son centro de atracción. Encontrá el QR para continuar.", e2: "Te recibe el mas grandote pero la segunda fila esta bien equipada, el guerrero lo tiene todo: Caballo, armadura, escudo y ¿que falta?.", r: ["espada"] },
            "Pileta": { e1: "Acá todo es diversión. Recordá: ¡acá se juega… pero no se corre! Encontrá el QR para continuar.", e2: "Desde lejos se ve y todos quieren usarlo aunque en invierno solo se puede contemplarlo. ¿Quién es?", r: ["parque acuatico", "parque", "juegos", "balde"] },
            "Plays": { e1: "Sonidos de victoria. Encontrá el QR para continuar.", e2: "Para esta mision completar solo un numero hay que poner, es el mas cansado y conside con la cantidad de tv, el numero es:", r: ["tres", "3"] }
        };

        let db = { nombre: "", hab: "", actual: "", ganadas: [], modo: "e1" };
        let scannerInst = null;

        function irA(id) {
            detenerScanner();
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'mapa-screen') { if(!db.actual || db.ganadas.includes(db.actual)) proximaMision(); renderMapa(); }
            if(id === 'home-screen') checkCampeon();
            if(id === 'album-screen') renderAlbum();
            window.scrollTo(0,0);
        }

        function comenzar() {
            const n = document.getElementById('inputNombre').value.trim();
            const h = document.getElementById('inputHab').value.trim();
            if(!n || !h) return Swal.fire("¡Epa!", "Faltan datos", "warning");
            db.nombre = n; db.hab = h; db.ganadas = []; proximaMision();
            document.getElementById('saludo').innerText = `¡HOLA ${n.toUpperCase()}!`;
            save(); irA('home-screen');
        }

        function proximaMision() {
            const libres = zonas.filter(z => !db.ganadas.includes(z));
            db.actual = libres.length > 0 ? libres[Math.floor(Math.random() * libres.length)] : "FINAL";
            db.modo = "e1"; save();
        }

        function renderMapa() {
            const list = document.getElementById('listaZonas'); list.innerHTML = "";
            zonas.forEach(z => {
                const ok = db.ganadas.includes(z); const esHoy = z === db.actual;
                const item = document.createElement('div');
                item.className = `zona-item ${esHoy ? 'zona-actual' : ''} ${ok ? 'zona-hecha' : ''}`;
                item.style.opacity = (!ok && !esHoy) ? "0.4" : "1";
                item.innerHTML = `<b>${ok ? '✔️' : (esHoy ? '⭐' : '🔒')} ${z}</b>`;
                if(esHoy && !ok) item.onclick = () => {
                    document.getElementById('m-titulo').innerText = db.actual;
                    document.getElementById('m-texto').innerText = misiones[db.actual].e1;
                    document.getElementById('cont-e1').style.display = "block";
                    document.getElementById('cont-e2').style.display = "none";
                    document.getElementById('preview-foto').style.display = "none";
                    irA('mision-screen');
                };
                list.appendChild(item);
            });
        }

        async function detenerScanner() {
            if (scannerInst) { try { await scannerInst.stop(); } catch(e) {} scannerInst = null; }
            document.getElementById('reader').style.display = "none";
            document.getElementById('btn-scan').style.display = "block";
        }

        function abrirEscaner() {
            const rd = document.getElementById('reader'); rd.style.display = "block";
            document.getElementById('btn-scan').style.display = "none";
            scannerInst = new Html5Qrcode("reader");
            scannerInst.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
                const leido = txt.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
                const esperado = db.actual.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
                if(leido.includes(esperado) || esperado.includes(leido)) {
                    detenerScanner().then(() => pasarE2());
                } else { Swal.fire("Epa", "Buscá el QR de " + db.actual, "error"); }
            }).catch(() => { 
                Swal.fire("Error", "Permití la cámara para jugar.", "error"); 
                document.getElementById('btn-scan').style.display = "block";
            });
        }

        function pasarE2() {
            db.modo = "e2";
            document.getElementById('m-texto').innerText = misiones[db.actual].e2;
            document.getElementById('cont-e1').style.display = "none";
            document.getElementById('cont-e2').style.display = "block";
            const esFoto = misiones[db.actual].tipo === "foto";
            
            // Ajuste aquí: ocultamos el campo de respuesta hasta que saque la foto si es de tipo foto
            document.getElementById('cont-respuesta').style.display = esFoto ? "none" : "block";
            document.getElementById('modo-foto').style.display = esFoto ? "block" : "none";
            save();
        }

        function fotoCapturada(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgPreview = document.getElementById('preview-foto');
                    imgPreview.src = e.target.result;
                    imgPreview.style.display = "block";

                    const link = document.createElement('a');
                    link.href = e.target.result;
                    link.download = `HowieGO-${db.actual}.jpg`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    Swal.fire("📸 ¡HERMOSA FOTO!", "Ya está guardada... adjuntala desde tu galería al enviarle el mensaje a Howie.", "success");
                    
                    // Mostramos el botón de WhatsApp y el campo para el código final
                    document.getElementById('btn-ayuda-wa').innerText = "📤 ENVIAR FOTO A HOWIE";
                    document.getElementById('cont-respuesta').style.display = "block"; 
                };
                reader.readAsDataURL(file);
            }
        }

        function validarRespuesta() {
            const val = document.getElementById('res-input').value.trim().toLowerCase();
            // Si es foto, aceptamos cualquier código (o el que Howie les dé), aquí lo dejamos flexible
            if(misiones[db.actual].tipo === "foto" || misiones[db.actual].r.some(r => val.includes(r))) {
                db.ganadas.push(db.actual);
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                const imgName = db.actual.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                document.getElementById('figu-slot').innerHTML = `<img src="img/${imgName}.jpg" style="width:160px">`;
                document.getElementById('e3-txt').innerText = `¡Ganaste la figu de ${db.actual}!`;
                proximaMision(); save(); irA('e3-screen');
                document.getElementById('res-input').value = "";
                document.getElementById('btn-ayuda-wa').innerText = "🆘 PEDIR AYUDA";
            } else { Swal.fire("Casi", "Intentalo de nuevo", "error"); }
        }

        function renderAlbum() {
            const grid = document.getElementById('grid-album'); grid.innerHTML = "";
            zonas.forEach(z => {
                const ok = db.ganadas.includes(z);
                const slot = document.createElement('div'); slot.className = "slot-figu";
                const imgName = z.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                slot.innerHTML = ok ? `<img src="img/${imgName}.jpg">` : `🔒<br><small>${z}</small>`;
                grid.appendChild(slot);
            });
        }

        function ayudaWA() {
            const msj = document.getElementById('btn-ayuda-wa').innerText.includes("ENVIAR FOTO") ? `¡Howie! Aquí te comparto la foto de mi desafío en ${db.actual}.` : `Hola Howie, soy ${db.nombre}, necesito ayuda en ${db.actual}.`;
            window.open(`https://wa.me/5493517669480?text=${encodeURIComponent(msj)}`);
        }

        function checkCampeon() { 
            if(db.ganadas.length === 12) {
                document.getElementById('cont-campeon').style.display = "block"; 
                document.getElementById('btn-mapa').style.display = "none";
            } 
        }

        function reclamarPremio() { 
            const msj = `¡Howie lo logré! Soy ${db.nombre} de la hab ${db.hab}. ¡Álbum completo! 🦉🎁`;
            window.open(`https://wa.me/5493517669480?text=${encodeURIComponent(msj)}`); 
        }
        
        function save() { localStorage.setItem('howiego_final_milenavp', JSON.stringify(db)); }
        
        function cerrarSesion() {
            Swal.fire({
                title: '¿Cerrar Sesión?',
                text: "Si sales ahora, perderás todo el progreso de tus figuritas.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#F57C00',
                cancelButtonColor: '#004A97',
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'No, seguir jugando'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear();
                    location.reload();
                }
            });
        }

        window.onload = () => {
            const s = localStorage.getItem('howiego_final_milenavp');
            if(s) { 
                db = JSON.parse(s); 
                document.getElementById('saludo').innerText = `¡HOLA ${db.nombre.toUpperCase()}!`; 
                irA('home-screen'); 
            }
        };
    </script>
</body>
</html>
