<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howie GO - Howard Johnson</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; overflow-x: hidden; }
        .screen { display: none !important; min-height: 100vh; width: 100%; box-sizing: border-box; padding: 20px; }
        .screen.active { display: block !important; }

        #login-screen.active, #home-screen.active {
            display: flex !important; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        #login-screen { background: linear-gradient(135deg, #004A97 0%, #003366 100%); }
        .card-sticker { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 85%; max-width: 320px; border: 3px solid #F57C00; }

        /* HOWIE ANIMADO LOGIN */
        .howie-container { position: relative; width: 100px; height: 110px; margin: 0 auto 15px; }
        .howie-cuerpo { width: 100%; position: absolute; bottom: 0; left: 0; z-index: 1; }
        .ala-animada { width: 85px; position: absolute; top: 18px; left: 10px; z-index: 2; transform-origin: 30% 70%; animation: saludoHowie 2s ease-in-out infinite; }
        @keyframes saludoHowie { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } }

        /* COMPONENTES */
        h1 { color: #004A97; margin: 0; font-size: 28px; text-transform: uppercase; }
        .btn-hj { background: #F57C00; color: white; border: none; padding: 15px; min-width: 260px; border-radius: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-blue { background: #004A97; }

        /* --- ESTILO INDESTRUCTIBLE PARA BOTONES HOME --- */

.btn-contenedor-sticker {
    width: 90% !important;
    max-width: 320px !important;
    height: 100px !important;
    border-radius: 20px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 0 20px !important;
    cursor: pointer !important;
    position: relative !important;
    overflow: visible !important;
    margin-bottom: 25px !important;
    border: none !important;
    transition: transform 0.1s;
}

/* Color NARANJA para el Mapa */
#btn-mapa-principal {
    background-color: #F57C00 !important;
    box-shadow: 0 6px 15px rgba(245, 124, 0, 0.4) !important;
}

/* Color AZUL para el Álbum */
#btn-album-principal {
    background-color: #004A97 !important;
    box-shadow: 0 6px 15px rgba(0, 74, 151, 0.4) !important;
}

.btn-contenedor-sticker:active {
    transform: scale(0.96);
}

.btn-sticker-lado {
    width: 100px;
    height: 100px;
    position: relative;
}

/* LOS HOWIES: Bajamos el bottom para que "pisen" el botón */
.btn-sticker-lado img {
    width: 155px !important; 
    height: auto !important;
    position: absolute !important;
    bottom: -25px !important; /* <--- MÁS ABAJO QUE NUNCA */
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3)) !important;
    z-index: 20 !important;
}

/* El del Mapa a la derecha */
.img-derecha {
    right: -25px !important;
}

/* El del Álbum a la izquierda */
.img-izquierda {
    right: auto !important;
    left: -25px !important;
}
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="card-sticker">
            <div class="howie-container">
                <img src="img/howie-cuerpo.png" class="howie-cuerpo">
                <img src="img/howie-ala.png" class="ala-animada">
            </div>
            <h1>Howie<span style="color:#F57C00">GO</span></h1>
            <input type="text" id="inputNombre" style="width:100%; padding:10px; margin:10px 0;" placeholder="Nombre">
            <input type="text" id="inputHabitacion" style="width:100%; padding:10px; margin:10px 0;" placeholder="Habitación">
            <button class="btn-hj" onclick="comenzarJuego()">¡Empezar!</button>
        </div>
    </div>

    <div id="home-screen" class="screen">
        <h1 id="saludo" style="color: #004A97;">¡HOLA!</h1>
        <p style="color: #666; margin-bottom: 30px;">¡Vamos a la aventura! 🦉✨</p>
        
        <div class="btn-contenedor-sticker" onclick="irA('mapa-screen')">
            <div class="btn-texto-lado">
                <span style="font-size: 13px; opacity: 0.8; display: block;">MISIONES</span>
                <span style="font-size: 21px; font-weight: bold;">VER MAPA</span>
            </div>
            <div class="btn-sticker-lado"><img src="img/boton-mapa.png"></div>
        </div>
        
        <div class="btn-contenedor-sticker btn-blue" onclick="irA('album-screen')">
            <div class="btn-sticker-lado"><img src="img/boton-album.png" class="espejado"></div>
            <div class="btn-texto-lado" style="text-align: right;">
                <span style="font-size: 13px; opacity: 0.8; display: block;">MIS FIGUS</span>
                <span style="font-size: 21px; font-weight: bold;">MI ÁLBUM</span>
            </div>
        </div>

        <button onclick="cerrarSesion()" style="margin-top: 30px; background: none; border: none; color: #999; text-decoration: underline;">Cerrar Sesión</button>
    </div>

    <div id="mapa-screen" class="screen">
        <h2 style="text-align: center; color: #004A97;">Misiones en el Hotel</h2>
        <div id="listaZonas"></div>
        <button class="btn-hj btn-blue" onclick="irA('home-screen')" style="width:100%">⬅ Volver al Inicio</button>
    </div>

    <div id="zona-screen" class="screen">
        <div style="background:white; padding:25px; border-radius:25px; text-align:center; border: 3px solid #ddd;">
            <h2 id="zonaTitulo" style="color:#F57C00;"></h2>
            <p id="textoEstado1"></p>
            <div id="estado1"><button class="btn-hj" onclick="iniciarEscaneo()">🔍 ESCANEAR QR</button></div>
            <div id="estado2" style="display:none;">
                <p id="textoEstado2" style="font-weight:bold; color:#004A97;"></p>
                <input type="text" id="respuestaInput" style="width:100%; padding:10px; margin-bottom:10px;" placeholder="Respuesta...">
                <button class="btn-hj" onclick="validarRespuesta()">Enviar</button>
            </div>
            <button onclick="irA('mapa-screen')" style="margin-top:20px; border:none; background:none; color:#999;">⬅ Volver al mapa</button>
        </div>
        <div id="reader" style="width:100%; max-width:350px; margin:20px auto; display:none;"></div>
    </div>

    <div id="album-screen" class="screen">
        <h2 style="text-align:center; color:#004A97;">Mis Figuritas</h2>
        <div id="contenedorFiguritas"></div>
        <button class="btn-hj btn-blue" style="margin-top:25px; width:100%" onclick="irA('home-screen')">⬅ Volver al Inicio</button>
    </div>

    <script>
        const zonasVisuales = ["Bicis", "Lobby", "Resto","Arqueria", "Patio cervecero", "Escaleras", "Camastros", "Kids", "Plaza", "Estatuas", "Pileta", "Plays"];
        const zonasData = {
            "Bicis": { e1: "Howie dice...", e2: "¿Bicis?", respuestasValidas: ["0","cero"], tipo: "auto" },
            "Lobby": { e1: "Howie mira...", e2: "¿Check-out?", respuestasValidas: ["10"], tipo: "auto" },
            "Resto": { e1: "Familia...", e2: "Pizza 3:", respuestasValidas: ["especial"], tipo: "auto" },
            "Arqueria": { e1: "Paciencia...", e2: "Valor?", respuestasValidas: ["amarillo"], tipo: "auto" },
            "Patio cervecero": { e1: "Brisa...", e2: "Inicial?", respuesta: "PIEDRA", tipo: "auto" },
            "Escaleras": { e1: "Vista...", e2: "Foto?", respuesta: "VISTA", tipo: "auto" },
            "Camastros": { e1: "Sol...", e2: "Escenario?", respuestasValidas: ["escenario"], tipo: "auto" },
            "Kids": { e1: "Jugar...", e2: "Mueve la cola?", respuestasValidas: ["perro"], tipo: "auto" },
            "Plaza": { e1: "Arena...", e2: "Balcones?", respuestasValidas: ["16"], tipo: "auto" },
            "Estatuas": { e1: "Figuras...", e2: "Siglas?", respuestasValidas: ["osn"], tipo: "auto" },
            "Pileta": { e1: "No correr...", e2: "Vigila?", respuestasValidas: ["bañero"], tipo: "auto" },
            "Plays": { e1: "Victoria...", e2: "Personaje?", respuestasValidas: ["kratos"], tipo: "auto" }
        };

        let player = { nombre: "", habitacion: "", actualNombre: "", completadas: [] };

        function irA(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            const target = document.getElementById(id);
            if(target) target.classList.add("active");
            if (id === "mapa-screen") renderMapa();
            if (id === "album-screen") renderAlbum();
            window.scrollTo(0, 0);
        }

        function seleccionarNuevaMision() {
            const restantes = zonasVisuales.filter(z => !player.completadas.includes(z));
            player.actualNombre = restantes.length > 0 ? restantes[Math.floor(Math.random() * restantes.length)] : "¡FINAL!";
            localStorage.setItem("howie", JSON.stringify(player));
        }

        function comenzarJuego() {
            const n = document.getElementById("inputNombre").value.trim();
            const h = document.getElementById("inputHabitacion").value.trim();
            if(!n || !h) return;
            player.nombre = n; player.habitacion = h; player.completadas = [];
            seleccionarNuevaMision();
            document.getElementById("saludo").innerText = `¡Hola ${player.nombre}!`;
            irA("home-screen");
        }

        function renderMapa() {
            const lista = document.getElementById("listaZonas");
            lista.innerHTML = "";
            zonasVisuales.forEach(z => {
                const div = document.createElement("div");
                div.className = "zona-item";
                if(z === player.actualNombre) {
                    div.innerHTML = `<span>⭐ <b>${z}</b></span>`;
                    div.style.border = "3px solid #F57C00"; div.style.background = "#fff9c4";
                    div.onclick = () => entrarZona(z);
                } else {
                    const ok = player.completadas.includes(z);
                    div.innerHTML = `<span>${ok ? '✔' : '🔒'} ${z}</span>`;
                    div.style.opacity = ok ? "1" : "0.5";
                }
                lista.appendChild(div);
            });
        }

        function entrarZona(z) {
            const data = zonasData[z];
            document.getElementById("zonaTitulo").innerText = z;
            document.getElementById("textoEstado1").innerText = data.e1;
            document.getElementById("textoEstado2").innerText = data.e2;
            document.getElementById("estado1").style.display = "block";
            document.getElementById("estado2").style.display = "none";
            irA("zona-screen");
        }

        function iniciarEscaneo() {
            const reader = document.getElementById("reader");
            reader.style.display = "block";
            const scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                scanner.stop().then(() => {
                    reader.style.display = "none";
                    if(text.toLowerCase().includes(player.actualNombre.toLowerCase())) {
                        document.getElementById("estado1").style.display = "none";
                        document.getElementById("estado2").style.display = "block";
                    }
                });
            });
        }

        function validarRespuesta() {
            const data = zonasData[player.actualNombre];
            const val = document.getElementById("respuestaInput").value.trim().toLowerCase();
            if(data.respuestasValidas && data.respuestasValidas.includes(val)) {
                player.completadas.push(player.actualNombre);
                confetti();
                seleccionarNuevaMision();
                irA("album-screen");
            }
        }

        function renderAlbum() {
            const cont = document.getElementById("contenedorFiguritas");
            cont.innerHTML = "";
            zonasVisuales.forEach(z => {
                const div = document.createElement("div");
                div.className = "sticker-slot";
                if(player.completadas.includes(z)) {
                    const img = z.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                    div.innerHTML = `<img src="img/${img}.jpg" class="img-sticker">`;
                } else { div.innerHTML = "🔒"; }
                cont.appendChild(div);
            });
        }

        function cerrarSesion() { localStorage.clear(); window.location.reload(); }

        window.onload = () => {
            const saved = localStorage.getItem("howie");
            if(saved) { 
                player = JSON.parse(saved); 
                document.getElementById("saludo").innerText = `¡Hola ${player.nombre}!`;
                irA("home-screen"); 
            }
        };
    </script>
</body>
</html>
