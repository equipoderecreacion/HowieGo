<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howie GO - Howard Johnson</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* 1. BASES */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; overflow-x: hidden; }
        .screen { display: none !important; min-height: 100vh; width: 100%; box-sizing: border-box; padding: 20px; }
        .screen.active { display: block !important; }
        #login-screen.active, #home-screen.active { display: flex !important; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        /* 2. LOGIN */
        #login-screen { background: linear-gradient(135deg, #004A97 0%, #003366 100%); }
        .card-login { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 85%; max-width: 320px; border: 3px solid #F57C00; }

        /* 3. BOTONES HOME */
        .btn-home {
            width: 90%; max-width: 320px; height: 100px; border-radius: 20px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; cursor: pointer; position: relative;
            overflow: visible; margin-bottom: 25px; border: none; transition: transform 0.1s;
        }
        #btn-mapa { background-color: #F57C00 !important; box-shadow: 0 6px 15px rgba(245, 124, 0, 0.4); }
        #btn-album { background-color: #004A97 !important; box-shadow: 0 6px 15px rgba(0, 74, 151, 0.4); }
        
        .btn-texto { color: white; text-align: left; z-index: 5; flex: 1; pointer-events: none; }
        .btn-texto b { font-size: 22px; display: block; }
        .btn-texto span { font-size: 13px; opacity: 0.9; text-transform: uppercase; }

        /* 4. STICKERS HOWIE */
        .sticker-container { width: 100px; height: 100px; position: relative; pointer-events: none; }
        .howie-sticker {
            width: 160px !important; height: auto !important;
            position: absolute !important; bottom: -22px !important;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.3));
            z-index: 10;
        }
        .howie-der { right: -25px !important; }
        .howie-izq { left: -25px !important; }

        /* 5. OTROS ESTILOS */
        .zona-item { background: white; padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        #contenedorFiguritas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .sticker-slot { aspect-ratio: 2/3; background: #ddd; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed #999; }
        .img-sticker { width: 100%; height: 100%; object-fit: cover; }
        .btn-volver { background: #004A97; color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="card-login">
            <h1 style="color:#004A97; margin:0;">HOWIE<span style="color:#F57C00">GO</span></h1>
            <input type="text" id="inputNombre" style="width:100%; padding:12px; margin:20px 0 10px; border:1px solid #ddd; border-radius:10px; box-sizing:border-box;" placeholder="Tu Nombre">
            <input type="text" id="inputHabitacion" style="width:100%; padding:12px; margin:0 0 20px; border:1px solid #ddd; border-radius:10px; box-sizing:border-box;" placeholder="Habitación">
            <button onclick="comenzarJuego()" style="background:#F57C00; color:white; border:none; padding:15px; width:100%; border-radius:12px; font-weight:bold; cursor:pointer;">¡EMPEZAR!</button>
        </div>
    </div>

    <div id="home-screen" class="screen">
        <h1 id="saludo" style="color:#004A97; text-transform: uppercase;">¡HOLA!</h1>
        <p style="color:#666; margin-bottom:40px;">¡Vamos a la aventura! 🦉✨</p>

        <div id="btn-mapa" class="btn-home" onclick="irA('mapa-screen')">
            <div class="btn-texto"><span>Misiones</span><b>VER MAPA</b></div>
            <div class="sticker-container"><img src="img/boton-mapa.png" class="howie-sticker howie-der"></div>
        </div>

        <div id="btn-album" class="btn-home" onclick="irA('album-screen')">
            <div class="sticker-container"><img src="img/boton-album.png" class="howie-sticker howie-izq"></div>
            <div class="btn-texto" style="text-align: right;"><span>Mis Figus</span><b>MI ÁLBUM</b></div>
        </div>

        <button onclick="cerrarSesion()" style="margin-top:40px; background:none; border:none; color:#999; text-decoration:underline; cursor:pointer;">Cerrar Sesión</button>
    </div>

    <div id="mapa-screen" class="screen">
        <h2 style="color:#004A97;">Misiones en el Hotel</h2>
        <div id="listaZonas"></div>
        <button class="btn-volver" onclick="irA('home-screen')">⬅ VOLVER AL INICIO</button>
    </div>

    <div id="album-screen" class="screen">
        <h2 style="color:#004A97;">Mis Figuritas</h2>
        <div id="contenedorFiguritas"></div>
        <button class="btn-volver" onclick="irA('home-screen')">⬅ VOLVER AL INICIO</button>
    </div>

    <div id="zona-screen" class="screen">
        <div style="background:white; padding:25px; border-radius:25px; text-align:center; border: 3px solid #F57C00;">
            <h2 id="zonaTitulo" style="color:#F57C00; margin:0;"></h2>
            <p id="textoEstado1" style="margin:20px 0; color:#666;"></p>
            <div id="estado1"><button onclick="iniciarEscaneo()" style="background:#F57C00; color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; width:100%; cursor:pointer;">🔍 ESCANEAR QR</button></div>
            <div id="estado2" style="display:none;">
                <p id="textoEstado2" style="font-weight:bold; color:#004A97;"></p>
                <input type="text" id="respuestaInput" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:10px; box-sizing:border-box;" placeholder="Tu respuesta...">
                <button onclick="validarRespuesta()" style="background:#F57C00; color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; width:100%; cursor:pointer;">ENVIAR</button>
            </div>
            <button onclick="irA('mapa-screen')" style="margin-top:25px; border:none; background:none; color:#999; cursor:pointer;">⬅ VOLVER AL MAPA</button>
        </div>
        <div id="reader" style="width:100%; max-width:350px; margin:20px auto; border-radius:20px; overflow:hidden; display:none; border: 4px solid #F57C00;"></div>
    </div>

    <script>
        const zonasVisuales = ["Bicis", "Lobby", "Resto","Arqueria", "Patio cervecero", "Escaleras", "Camastros", "Kids", "Plaza", "Estatuas", "Pileta", "Plays"];
        const zonasData = {
            "Bicis": { e1: "Viento a dos ruedas...", e2: "¿Cuántas bicis con rueditas?", respuestasValidas: ["0","cero"], tipo: "auto" },
            "Lobby": { e1: "Howie mira...", e2: "¿Hora de check-out?", respuestasValidas: ["10"], tipo: "auto" },
            "Resto": { e1: "Plato favorito...", e2: "Pizza nro 3:", respuestasValidas: ["especial"], tipo: "auto" },
            "Arqueria": { e1: "Paciencia...", e2: "¿Color de más valor?", respuestasValidas: ["amarillo"], tipo: "auto" },
            "Patio cervecero": { e1: "Brisa...", e2: "Misión de foto", respuestasValidas: ["piedra"], tipo: "auto" },
            "Escaleras": { e1: "Vista...", e2: "Misión de foto", respuestasValidas: ["vista"], tipo: "auto" },
            "Camastros": { e1: "Sol...", e2: "¿Nombre del escenario?", respuestasValidas: ["escenario"], tipo: "auto" },
            "Kids": { e1: "Cuatro patas...", e2: "¿Quién mueve la cola?", respuestasValidas: ["perro"], tipo: "auto" },
            "Plaza": { e1: "Arena...", e2: "¿Cuántos balcones ves?", respuestasValidas: ["16"], tipo: "auto" },
            "Estatuas": { e1: "Guerrero...", e2: "Siglas en la base:", respuestasValidas: ["osn"], tipo: "auto" },
            "Pileta": { e1: "Agua...", e2: "¿Quién vigila?", respuestasValidas: ["bañero"], tipo: "auto" },
            "Plays": { e1: "Victoria...", e2: "¿Personaje famoso?", respuestasValidas: ["kratos"], tipo: "auto" }
        };

        let player = { nombre: "", habitacion: "", actualNombre: "", completadas: [] };

        function irA(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            const target = document.getElementById(id);
            if(target) {
                target.classList.add("active");
                if (id === "mapa-screen") renderMapa();
                if (id === "album-screen") renderAlbum();
                window.scrollTo(0,0);
            }
        }

        function seleccionarNuevaMision() {
            const restantes = zonasVisuales.filter(z => !player.completadas.includes(z));
            player.actualNombre = restantes.length > 0 ? restantes[Math.floor(Math.random() * restantes.length)] : "¡FINAL!";
            localStorage.setItem("howie", JSON.stringify(player));
        }

        function comenzarJuego() {
            const n = document.getElementById("inputNombre").value.trim();
            const h = document.getElementById("inputHabitacion").value.trim();
            if(!n || !h) { Swal.fire("¡Opa!", "Completá tus datos", "warning"); return; }
            player.nombre = n; player.habitacion = h; player.completadas = [];
            seleccionarNuevaMision();
            document.getElementById("saludo").innerText = `¡HOLA ${player.nombre.toUpperCase()}!`;
            irA("home-screen");
        }

        function renderMapa() {
            const lista = document.getElementById("listaZonas");
            lista.innerHTML = "";
            zonasVisuales.forEach(z => {
                const div = document.createElement("div");
                div.className = "zona-item";
                if(z === player.actualNombre) {
                    div.innerHTML = `<span>⭐ <b>${z}</b></span> <small style="color:#F57C00">¡IR AQUÍ!</small>`;
                    div.style.border = "2px solid #F57C00"; div.style.background = "#fff9c4";
                    div.onclick = () => entrarZona(z);
                } else {
                    const ok = player.completadas.includes(z);
                    div.innerHTML = `<span>${ok ? '✔' : '🔒'} ${z}</span>`;
                    div.style.opacity = ok ? "1" : "0.5";
                }
                lista.appendChild(div);
            });
        }

        function entrarZona(z) {
            const data = zonasData[z];
            document.getElementById("zonaTitulo").innerText = z;
            document.getElementById("textoEstado1").innerText = data.e1;
            document.getElementById("textoEstado2").innerText = data.e2;
            document.getElementById("estado1").style.display = "block";
            document.getElementById("estado2").style.display = "none";
            irA("zona-screen");
        }

        function iniciarEscaneo() {
            const reader = document.getElementById("reader");
            reader.style.display = "block";
            const scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                scanner.stop().then(() => {
                    reader.style.display = "none";
                    if(text.toLowerCase().includes(player.actualNombre.toLowerCase())) {
                        document.getElementById("estado1").style.display = "none";
                        document.getElementById("estado2").style.display = "block";
                    } else { Swal.fire("QR Incorrecto", "No es de esta zona", "warning"); }
                });
            }).catch(() => { Swal.fire("Error", "Cámara no disponible", "error"); });
        }

        function validarRespuesta() {
            const data = zonasData[player.actualNombre];
            const val = document.getElementById("respuestaInput").value.trim().toLowerCase();
            if(data.respuestasValidas && data.respuestasValidas.includes(val)) {
                player.completadas.push(player.actualNombre);
                confetti();
                Swal.fire("¡Bien!", "Figurita ganada", "success").then(() => {
                    seleccionarNuevaMision();
                    document.getElementById("respuestaInput").value = "";
                    irA("album-screen");
                });
            } else { Swal.fire("Casi...", "Revisá el dato", "error"); }
        }

        function renderAlbum() {
            const cont = document.getElementById("contenedorFiguritas");
            cont.innerHTML = "";
            zonasVisuales.forEach(z => {
                const div = document.createElement("div");
                div.className = "sticker-slot";
                if(player.completadas.includes(z)) {
                    const img = z.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                    div.innerHTML = `<img src="img/${img}.jpg" class="img-sticker">`;
                } else { div.innerHTML = "🔒"; }
                cont.appendChild(div);
            });
        }

        function cerrarSesion() { localStorage.clear(); window.location.reload(); }

        window.onload = () => {
            const saved = localStorage.getItem("howie");
            if(saved) { 
                player = JSON.parse(saved); 
                document.getElementById("saludo").innerText = `¡HOLA ${player.nombre.toUpperCase()}!`;
                irA("home-screen"); 
            }
        };
    </script>
</body>
</html>
