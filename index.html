<!DOCTYPE html>

<style>
/* 1. BASES GENERALES */
body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  color: #333;
}

/* Manejo de Pantallas: Fundamental para que funcione el juego */
.screen {
  display: none;
  min-height: 100vh;
  box-sizing: border-box;
}

.screen.active {
  display: block;
}

/* Ajuste para que las pantallas de juego NO tengan el fondo azul del login */
#mapa-screen, #album-screen, #camera-screen, #home-screen {
    padding: 20px;
    background: #f4f4f4;
}

/* 2. PANTALLA DE LOGIN (IDENTIDAD HOWARD JOHNSON) */
/* 1. Fondo completo que ocupa TODO el celular */
.full-page-login {
    background: linear-gradient(135deg, #004A97 0%, #003366 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100vw;
    height: 100vh;
    position: fixed; /* Esto evita que se mueva o queden huecos blancos */
    top: 0;
    left: 0;
    padding: 20px;
    box-sizing: border-box;
}

/* 2. La tarjeta blanca ajustada */
.login-card-sticker {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 320px; /* Un poquito más angosta para que no toque los bordes */
    text-align: center;
}

.logo-howiego-container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 25px;
    border-bottom: 2px solid #F57C00;
    padding-bottom: 10px;
}

.logo-howie-init {
    width: 65px;
    height: 65px;
    object-fit: contain;
    margin-right: 15px;
    filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2)); 
}

.text-logo-title {
    font-size: 30px;
    font-weight: 900; /* Más negrita para que parezca un logo */
    color: #004A97;    /* Azul HJ */
    margin: 0;
    text-transform: uppercase;
    
    /* --- EL CAMBIO CLAVE --- */
    letter-spacing: -2px; /* Valores negativos juntan las letras */
    display: inline-block; 
}

.highlight-orange {
    color: #F57C00;   /* Naranja HJ */
    margin-left: -2px; /* Empuja el GO todavía más hacia la izquierda */
}

.welcome-text { font-size: 14px; color: #666; margin-bottom: 20px; }

/* Inputs del Login */
.input-form-container input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

.input-form-container input:focus { border-color: #F57C00; outline: none; }

/* Botón Comenzar (Naranja) */
.btn-hj-primary {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background-color: #F57C00;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.2s;
}

.btn-hj-primary:active { transform: scale(0.95); }

/* 3. BOTONES DEL JUEGO (AZULES CON HOWIE) */
.btn-main {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: fit-content;
    min-width: 260px;
    margin: 0 auto 15px auto;
    padding: 8px 20px;
    font-weight: bold;
    font-size: 17px;
    border-radius: 15px;
    cursor: pointer;
    background-color: #004A97; 
    color: white;             
    border: 2px solid #F57C00; 
    transition: transform 0.2s;
}

.icono-howie {
    width: 50px;
    height: 50px;
    margin-right: 15px;
    object-fit: contain;
    filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));
}

/* 4. MAPA Y ESTACIONES */

.zona-item {
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
}

/* 5. ESCÁNER QR */
#reader {
    width: 100% !important;
    max-width: 320px;
    margin: 15px auto;
    border: 4px solid #F57C00;
    border-radius: 15px;
    overflow: hidden;
}

/* 6. ÁLBUM DE FIGURITAS */
#contenedorStickers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 15px;
    background: #e0e0e0;
    border-radius: 10px;
}

.sticker-slot {
    aspect-ratio: 2 / 3;
    background: #ccc;
    border-radius: 5px;
    border: 1px dashed #999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.sticker-slot.ganada {
    border: none;
    background: white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.sticker-img { width: 95%; height: 95%; object-fit: cover; }

/* Botón Cerrar Sesión (Naranja) */
.btn-secundario {
    display: block;
    width: fit-content;
    min-width: 200px;
    margin: 20px auto;
    padding: 10px;
    background-color: #F57C00;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.branding-corner {
    position: absolute;
    bottom: 10px;
    width: 100%;
    left: 0;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    text-align: center;
}
</style>
</head>

   <div class="botones-container"> <button class="btn-main" onclick="irA('mapa-screen')">

<div id="zona-screen" class="screen">

  <div class="card">
    <div id="estado1">

<!-- ÁLBUM -->
<div id="album-screen" class="screen" style="display:none;">

    <button onclick="irA('home-screen')">⬅ Volver</button>

  <div class="album-container" id="contenedorFiguritas"></div>

<style>
  /* Contenedor del Álbum */
  .album-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 columnas para que entren bien en el celu */
    gap: 12px;
    padding: 15px;
    background: #f8f8f8;
  }

  /* Espacio de cada figurita (Vertical 2:3) */
  .sticker-slot {
    aspect-ratio: 2 / 3; 
    background: #e0e0e0;
    border: 2px dashed #bbb;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  /* Cuando ya ganaron el sticker */
  .sticker-slot.ganada {
    border: 2px solid #fbc02d; /* El amarillo de Howie */
    background: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    animation: aparecer 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* La imagen de la figurita .jpg */
  .sticker-img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Llena el espacio sin deformarse */
    display: block;
  }

  /* El número que se ve cuando no tienen la figurita */
  .numero-guia {
    font-weight: bold;
    color: #999;
    font-size: 1.2rem;
  }

  @keyframes aparecer {
    0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
/* Esto asegura que todas las pantallas centren su contenido igual que el menú */
.screen {
    display: none;
    width: 100%;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
    /* Estas 3 líneas centran la 'card' en el medio de la pantalla */
    flex-direction: column;
    align-items: center; 
    justify-content: flex-start; 
}

.screen.active {
    display: flex; /* Cambiamos a flex para que funcionen los centrados de arriba */
}

/* La tarjeta que ya tenías y que funciona bien */
.card {
    background: white;
    width: 90%;           /* Para que en el celu no toque los bordes */
    max-width: 400px;     /* Medida ideal para que en la compu no sea gigante */
    margin: 40px auto;    /* 40px de aire arriba y 'auto' para centrar a los costados */
    padding: 25px;
    border-radius: 20px;  /* Bordes más redondeados para que parezca un sticker */
    box-shadow: 0 10px 25px rgba(0,0,0,0.2); /* Sombrita más suave */
    text-align: center;
    box-sizing: border-box; /* Fundamental para que no se "vaya" de ancho */
}

/* Fondo azul solo para el Login, pero sin romper el centrado */
#login-screen {
    background: linear-gradient(135deg, #004A97 0%, #003366 100%);
    display: none; /* Se oculta por defecto */
    width: 100%;
    min-height: 100vh;
    align-items: center;    /* Centra la card verticalmente */
    justify-content: center; /* Centra la card horizontalmente */
}

/* Cuando el login está activo, se vuelve flexible para centrar la tarjeta */
#login-screen.active {
    display: flex;
}
</style>

<script>
/* =====================
   DATOS DEL JUEGO
===================== */

];

const zonasData = {

  },
  "Resto": {

  },
  "Patio cervecero": {
    e1: "Howie busca la brisa de la tarde y el tintineo de los vasos fríos. Bajo las luces, las historias se cuentan mejor. Encontrá el QR para continuar.",
    e2: "Howie dice que el suelo está lleno de tesoros pequeños. Usá las piedritas para formar la inicial de la persona que atiende el foodtruck.",
    respuesta: "PIEDRA",
    tipo: "foto"
  },
  "Escaleras": {
    e1: "Howie siempre se detiene un momento antes de subir. Dice que desde acá las cosas se ven distintas… Encontrá el QR para continuar.",
    e2: "Howie se queda justo donde el esfuerzo afloja. Desde ahí, los colores cuentan historias de la ciudad. Tomale una foto y envíasela a Howie.",
    respuesta: "VISTA",
    tipo: "foto"
  },
  "Camastros": {
    e1: "Howie encontró el lugar donde el tiempo se detiene y el sol te abraza en silencio. Encontrá el QR para continuar.",
    e2: "No siempre es el lugar más ruidoso, pero cuando algo importante pasa, todas las miradas terminan ahí. ¿Sabés qué es?",

  },
  "Kids": {

    e2: "No se mete a jugar, pero cuida el juego. Está siempre atento mientras otros chapotean. ¿Quién es?",
    respuestasValidas: ["guardavidas", "el guardavidas", "bañero", "el bañero", "socorrista"],
    tipo: "auto"
  },
  "Plays": {
    e1: "Howie se dejó llevar por las luces parpadeantes y los sonidos de victoria. Encontrá el QR para continuar.",
    e2: "Famoso soy, en lo alto estoy, si queres completar el desafío deci que personaje soy.",
    respuestasValidas: ["cratos", "kratos"],
    tipo: "auto"
  }
};
 

let player = {
  nombre: "",
  habitacion: "",
  actualNombre: "", 
  completadas: []
};

/* =====================
   NAVEGACIÓN
===================== */
function irA(id) {
    // 1. Manejo de clases para mostrar/ocultar pantallas
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    const target = document.getElementById(id);
    if(target) {
        target.classList.add("active");
    } else {
        console.error("No se encontró la pantalla: " + id);
        return;
    }

    // 2. Lógica de renderizado según la pantalla
    if (id === "mapa-screen") {
        renderMapa();
    } else if (id === "album-screen") {
        renderAlbum();
    }

    // 3. RESETEO DE BOTÓN DE AYUDA (Para que siempre vuelva a ser azul al cambiar de pantalla)
    const btnAyuda = document.getElementById("btnAyuda");
    if (btnAyuda) {
        btnAyuda.innerText = "🆘 PEDIR AYUDA A HOWIE";
        btnAyuda.style.background = "#004A97";
        btnAyuda.onclick = pedirAyuda;
    }
}

/* =====================
    LOGIN
===================== */
const loginBtn = document.getElementById("loginBtn");
if (loginBtn) {
    loginBtn.addEventListener("click", () => {
        const n = document.getElementById("inputNombre").value.trim();
        const h = document.getElementById("inputHabitacion").value.trim();
        
        if (!n || !h) {
            alert("Por favor, completá nombre y habitación");
            return;
        }

        player.nombre = n;
        player.habitacion = h;
        player.completadas = [];
        
        const inicioAzar = Math.floor(Math.random() * circuitoOculto.length);
        player.actualNombre = circuitoOculto[inicioAzar];

        localStorage.setItem("howie", JSON.stringify(player));
        iniciarHome();
    });
}

function iniciarHome() {
    const saludo = document.getElementById("saludo");
    if (saludo) saludo.innerText = `¡Hola ${player.nombre}!`;
    actualizarInterfazHome();
    irA("home-screen");
}

/* =====================
    MAPA Y ÁLBUM
===================== */
function renderMapa() {
    const listaContenedor = document.getElementById("listaZonas");
    if (!listaContenedor) return;
    listaContenedor.innerHTML = "";

    const juegoTerminado = player.completadas.length >= 12;

    zonasVisuales.forEach((z) => {
        const div = document.createElement("div");
        div.className = "zona-item";
        div.style.padding = "15px";
        div.style.margin = "10px 0";
        div.style.borderRadius = "10px";
        div.style.display = "flex";
        div.style.justifyContent = "space-between";
        div.style.alignItems = "center";
        div.style.border = "1px solid #ddd";

        if (!juegoTerminado && z === player.actualNombre) {
            div.innerHTML = `<span>⭐ <b>${z}</b></span>`;
            div.style.border = "2px solid #fbc02d";
            div.style.background = "#fff9c4";
            div.style.cursor = "pointer";
            div.onclick = () => entrarZona(z);
        } else if (player.completadas.includes(z)) {
            div.innerHTML = `<span>✔ ${z}</span> <span style="color:green; font-size:12px;">Completado</span>`;
            div.style.background = "#e8f5e9";
        } else {
            div.innerHTML = `<span>🔒 ${z}</span>`;
            div.style.opacity = "0.5";
            div.style.background = "#f5f5f5";
        }
        listaContenedor.appendChild(div);
    });
}

function renderAlbum() {
    const contenedor = document.getElementById("contenedorFiguritas");
    if (!contenedor) return;
    contenedor.innerHTML = ""; 

    zonasVisuales.forEach((zona) => {
        const div = document.createElement("div");
        div.className = "sticker-slot"; 
        const zonaParaComparar = zona.trim().toLowerCase();
        const estaGanada = player.completadas.some(c => c.trim().toLowerCase() === zonaParaComparar);

        if (estaGanada) {
            const nombreArchivo = zonaParaComparar
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, '-');
            div.innerHTML = `<img src="img/${nombreArchivo}.jpg" class="sticker-img">`;
            div.classList.add("ganada");
        } else {
            div.innerHTML = `<span class="candado">🔒</span>`;
        }
        contenedor.appendChild(div);
    });

    if (player.completadas.length >= 12) {
        const mensajeFinal = document.createElement("div");
        mensajeFinal.style.cssText = "grid-column: 1 / -1; background: #fbc02d; padding: 20px; border-radius: 15px; margin-top: 15px; text-align: center; font-weight: bold; border: 2px solid #333; color: #333;";
        mensajeFinal.innerHTML = `
            <h3 style="margin:0;">¡LO LOGRASTE! 🏆</h3>
            <p>Buscá a los profes para tu premio.</p>
            <button onclick="enviarWhatsappFinal()" style="background:#25D366; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">AVISAR POR WHATSAPP</button>
        `;
        contenedor.appendChild(mensajeFinal);
    }
}

/* =====================
    LÓGICA DE PREMIO (mostrarEstado única)
===================== */
function mostrarEstado(n) {
    const e1 = document.getElementById("estado1");
    const e2 = document.getElementById("estado2");
    const e3 = document.getElementById("estado3");

    if(e1) e1.style.display = (n === 1) ? "block" : "none";
    if(e2) e2.style.display = (n === 2) ? "block" : "none";
    if(e3) e3.style.display = (n === 3) ? "block" : "none";

    const btnAyuda = document.getElementById("btnAyuda");
    if (btnAyuda) btnAyuda.style.display = (n === 3) ? "none" : "block";

    if (n === 3) {
        obtenerRecompensa();

        if (typeof confetti === 'function') {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#fbc02d', '#ffffff', '#4CAF50'] });
        }

        const zonaGanada = player.actualNombre;
        const nombreLimpio = zonaGanada.toLowerCase().trim()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, '-');
        
        const esElFinal = player.completadas.length >= 12;

        Swal.fire({
            title: esElFinal ? '¡ÁLBUM COMPLETADO! 🏆' : '¡CONSEGUIDO!',
            text: esElFinal ? '¡Lo lograste! Avisale a los profes para tu premio.' : `¡Ganaste la figurita de ${zonaGanada}!`,
            imageUrl: `./img/${nombreLimpio}.jpg`,
            imageWidth: 200,
            imageHeight: 300,
            confirmButtonText: esElFinal ? '🎁 RECLAMAR PREMIO' : 'VER MI ÁLBUM',
            confirmButtonColor: esElFinal ? '#4CAF50' : '#fbc02d',
            allowOutsideClick: false
        }).then(() => {
            if (esElFinal) {
                enviarWhatsappFinal();
            } else {
                // --- MOTOR ALEATORIO REFORZADO ---
                // Filtramos circuitoOculto buscando las que NO están en player.completadas
                const restantes = circuitoOculto.filter(z => !player.completadas.includes(z));
                
                if (restantes.length > 0) {
                    // Elegimos una al azar de las que sobran
                    const indiceAzar = Math.floor(Math.random() * restantes.length);
                    player.actualNombre = restantes[indiceAzar];
                    
                    console.log("Próxima parada aleatoria: " + player.actualNombre);
                }
                
                localStorage.setItem("howie", JSON.stringify(player));
            }
            irA('album-screen');
        });
    }
}

function enviarWhatsappFinal() {
    const mensajeFinal = encodeURIComponent(`¡TERMINÉ EL JUEGO! 🏆\nNombre: ${player.nombre}\nHabitación: ${player.habitacion}`);
    window.open(`https://wa.me/5493541215391?text=${mensajeFinal}`, '_blank');
}

/* =====================
    VALIDACIÓN Y FOTO
===================== */
function entrarZona(zona) {
    const data = zonasData[zona];
    if (!data) {
        console.error("No hay datos para la zona: " + zona);
        return;
    }

    // Llenamos los textos del HTML con la info de la zona
    document.getElementById("zonaTitulo").innerText = zona;
    document.getElementById("textoEstado1").innerText = data.e1 || "Buscá el código QR en esta zona.";
    document.getElementById("textoEstado2").innerText = data.e2 || "Resolvé el desafío para ganar la figurita.";
    
    // Mostramos u ocultamos la sección de foto según el tipo
    const seccionFoto = document.getElementById("seccionFoto");
    const seccionInput = document.getElementById("seccionInput"); // El div que tiene el input de texto
    
    if (data.tipo === "foto") {
        if (seccionFoto) seccionFoto.style.display = "block";
        if (seccionInput) seccionInput.style.display = "none";
    } else {
        if (seccionFoto) seccionFoto.style.display = "none";
        if (seccionInput) seccionInput.style.display = "block";
    }
    
    document.getElementById("previewContenedor").style.display = "none";
    
    // IMPORTANTE: Forzamos el Estado 1 al entrar
    mostrarEstado(1);
    irA("zona-screen");
}

function previsualizarFoto(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById("fotoPreview");
            const cont = document.getElementById("previewContenedor");
            if (img) img.src = e.target.result;
            if (cont) cont.style.display = "block";
            
            const btnAyuda = document.getElementById("btnAyuda");
            if (btnAyuda) {
                btnAyuda.innerText = "💬 ENVIAR FOTO A HOWIE";
                btnAyuda.style.background = "#25D366";
                btnAyuda.onclick = () => ejecutarEnvioFinal(e.target.result);
            }
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function ejecutarEnvioFinal(base64Image) {
    // 1. DESCARGA DE LA IMAGEN
    const link = document.createElement("a");
    link.href = base64Image;
    link.download = `Mision_Howie_${player.actualNombre}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // 2. CARTEL DE AVISO
    Swal.fire({
        title: '¡Foto Guardada!',
        text: 'Enviá la foto por WhatsApp y esperá que Howie te pase el código secreto para continuar.',
        icon: 'success',
        confirmButtonText: 'ABRIR WHATSAPP',
        confirmButtonColor: '#25D366'
    }).then(() => {
        // 3. ABRIMOS WHATSAPP
        const mensaje = encodeURIComponent(`¡Hola Howie! Soy ${player.nombre}. Acá te mando la foto de mi misión en: ${player.actualNombre}.`);
        window.open(`https://wa.me/5493541215391?text=${mensaje}`, '_blank');

        // 4. RESETEO DEL BOTÓN DE AYUDA (Vuelve a ser azul)
        const btnAyuda = document.getElementById("btnAyuda");
        if (btnAyuda) {
            btnAyuda.innerText = "🆘 PEDIR AYUDA A HOWIE";
            btnAyuda.style.background = "#004A97";
            btnAyuda.onclick = pedirAyuda;
        }

        // 5. IMPORTANTE: Mostramos el input de texto para que ponga el código que recibió
        const seccionInput = document.getElementById("seccionInput");
        if (seccionInput) seccionInput.style.display = "block";
        
        // No llamamos a mostrarEstado(3), el usuario se queda en la pantalla de la misión
    });
}

function validarRespuesta() {
    const zona = player.actualNombre;
    const data = zonasData[zona]; 
    const inputElement = document.getElementById("respuestaInput");
    
    if (!inputElement || !data) {
        console.error("Falta el input o la data de la zona:", zona);
        return;
    }

    const valorEscrito = inputElement.value.trim().toLowerCase();
    let esCorrecto = false;

    // --- 1. VALIDACIÓN PARA DESAFÍOS NUMÉRICOS (TIPO AUTO) ---
    // Esto es lo que faltaba: permite que haya varias respuestas válidas (ej: [4, "cuatro"])
    if (data.tipo === "auto") {
        if (data.respuestasValidas) {
            esCorrecto = data.respuestasValidas.some(r => r.toString().toLowerCase() === valorEscrito);
        }
    } 
    // --- 2. VALIDACIÓN PARA CÓDIGOS DE WHATSAPP O FOTOS ---
    // Aquí es donde entra el código que el profe le manda al huésped
    else {
        if (data.respuesta) {
            esCorrecto = (valorEscrito === data.respuesta.toLowerCase());
        }
    }

    if (esCorrecto) {
        inputElement.value = ""; // Limpiamos el campo para la próxima
        
        // IMPORTANTE: Solo cuando el código es correcto damos el punto y el premio
        mostrarEstado(3); 
    } else {
        Swal.fire({
            title: 'Código Incorrecto',
            text: 'Howie dice que revises bien el código o la respuesta. ¡Intentá de nuevo!',
            icon: 'warning',
            confirmButtonColor: '#004A97' // Azul HJ
        });
    }
}

/* =====================
    AUXILIARES
===================== */
function obtenerRecompensa() {
    if (!player.completadas.includes(player.actualNombre)) {
        player.completadas.push(player.actualNombre);
        localStorage.setItem("howie", JSON.stringify(player));
        actualizarInterfazHome();
    }
}

function actualizarInterfazHome() {
    const p = document.getElementById("progreso");
    if (p) p.innerText = `Progreso: ${player.completadas.length} / 12`;
}

function pedirAyuda() {
    const mensaje = encodeURIComponent(`¡Hola Howie! Soy ${player.nombre}. Necesito una pista en ${player.actualNombre}.`);
    window.open(`https://wa.me/5493541215391?text=${mensaje}`, '_blank');
}

window.onload = () => {
    const saved = localStorage.getItem("howie");
    if (saved) {
        player = JSON.parse(saved);
        iniciarHome();
    }
};
/* =====================
   CERRAR SESIÓN (Restaurado)
===================== */
function cerrarSesion() {
    Swal.fire({
        title: '¿Cerrar sesión?',
        text: "Se borrará todo tu progreso. ¿Estás seguro?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sí, borrar todo',
        cancelButtonText: 'No, seguir jugando'
    }).then((result) => {
        if (result.isConfirmed) {
            localStorage.clear();
            window.location.reload();
        }
    });
}
/* =====================
    ESCÁNER QR (Restaurado)
===================== */
let html5QrCode = null;

async function iniciarEscaneo() {
    const readerDiv = document.getElementById('reader');
    if (!readerDiv) return;

    readerDiv.style.display = 'block';
    const btnScan = document.getElementById('btnAbrirScanner');
    if (btnScan) btnScan.style.display = 'none';

    if (html5QrCode) {
        try { await html5QrCode.stop(); } catch (e) {}
        html5QrCode = null;
    }

    setTimeout(() => {
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                detenerEscaneo(); 
                procesarLecturaQR(decodedText);
            }
        ).catch(err => {
            console.error("Error cámara:", err);
            Swal.fire('Error', 'No se pudo acceder a la cámara.', 'error');
        });
    }, 300);
}

function detenerEscaneo() {
    if (html5QrCode) {
        html5QrCode.stop().then(() => {
            html5QrCode = null;
            document.getElementById('reader').style.display = 'none';
            const btnScan = document.getElementById('btnAbrirScanner');
            if (btnScan) btnScan.style.display = 'block';
        }).catch(() => {
            document.getElementById('reader').style.display = 'none';
        });
    }
}

function procesarLecturaQR(decodedText) {
    // Limpieza de la URL del QR para sacar solo el nombre de la zona
    let zonaLeida = "";
    if (decodedText.includes("zona=")) {
        const url = new URL(decodedText);
        zonaLeida = url.searchParams.get("zona").replace(/-/g, " ");
    } else {
        zonaLeida = decodedText;
    }

    // Comparamos con la zona que le toca al jugador actualmente
    if (zonaLeida.toLowerCase() === player.actualNombre.toLowerCase()) {
        mostrarEstado(2); // Pasa al desafío
    } else {
        Swal.fire('Zona Equivocada', `Este QR no es de ${player.actualNombre}. ¡Seguí buscando!`, 'warning');
    }
}
